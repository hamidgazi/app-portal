<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a10"/>
      <stop offset="50%" stop-color="#141420"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners for Maskable Android PWA -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />

  <!-- Central Star of 8 Points (Islamic Geometry) -->
  <g transform="translate(256,256) scale(0.85)" filter="url(#glow)">
    <rect x="-180" y="-180" width="360" height="360" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="5" opacity="0.3" transform="rotate(45)"/>
    <rect x="-180" y="-180" width="360" height="360" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="5" opacity="0.3"/>
  </g>

  <!-- Stylized Open Book (Hadith Corpus) -->
  <g transform="translate(256, 265)">
    <!-- Book Spine & Pages Glow -->
    <path d="M 0 -70 C -60 -100, -150 -90, -170 -60 L -170 100 C -150 70, -60 80, 0 110 C 60 80, 150 70, 170 100 L 170 -60 C 150 -90, 60 -100, 0 -70 Z" fill="#181824" stroke="url(#goldGrad)" stroke-width="8"/>
    
    <!-- Left Page Lines -->
    <path d="M -140 -30 C -90 -45, -40 -40, -15 -30" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M -140 0 C -90 -15, -40 -10, -15 0" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M -140 30 C -90 15, -40 20, -15 30" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M -140 60 C -90 45, -40 50, -15 60" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <!-- Right Page Lines -->
    <path d="M 140 -30 C 90 -45, 40 -40, 15 -30" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M 140 0 C 90 -15, 40 -10, 15 0" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M 140 30 C 90 15, 40 20, 15 30" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M 140 60 C 90 45, 40 50, 15 60" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <!-- Center Bookmark Ribbon -->
    <path d="M 0 -80 L 0 135 L 14 120 L 28 135 L 28 -75 Z" fill="url(#cyanGrad)"/>

    <!-- Crown Calligraphic Element -->
    <circle cx="0" cy="-125" r="16" fill="url(#goldGrad)"/>
    <circle cx="-42" cy="-115" r="10" fill="url(#goldGrad)" opacity="0.8"/>
    <circle cx="42" cy="-115" r="10" fill="url(#goldGrad)" opacity="0.8"/>
  </g>

  <!-- Typography Crest Subtitle -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="3">HADITH SCIENCES</text>
  <text x="256" y="480" font-family="'Amiri', serif" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="middle">عُـلُـومُ الـحَـدِيـثِ</text>
</svg>
