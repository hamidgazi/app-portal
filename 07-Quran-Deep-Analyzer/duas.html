<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>🤲 Quranic Duas Encyclopedia • دعاؤں کا قرآنی انسائیکلوپیڈیا</title>
  <meta name="description" content="The 78 Canonical Quranic Supplications (40 Rabbana, Prophetic & Believers' Duas) with Occasions (کب پڑھیں), Purposes (کس مقصد کے لیے), and Reasons for Revelation (شانِ نزول).">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤲</text></svg>">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/commands-manners.css">
  <link rel="stylesheet" href="css/duas.css?v=20261107_rev3">
  <style>
    body {
      background: radial-gradient(circle at 50% 0%, #17153a 0%, #06080e 75%);
      color: #f8fafc;
      font-family: var(--font-ui), sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      padding-bottom: 80px;
      direction: rtl;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .duas-app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(6, 8, 14, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 16px;
    }

    .duas-header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .duas-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .duas-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .duas-logo-badge {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .duas-title-group h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: -0.3px;
    }

    .duas-title-group p {
      margin: 2px 0 0 0;
      font-size: 0.82rem;
      color: #94a3b8;
    }

    .duas-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .duas-back-btn:hover {
      background: rgba(56, 189, 248, 0.22);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header class="duas-app-header">
    <div class="duas-header-inner">
      <div class="duas-header-top">
        <a href="duas.html" class="duas-brand">
          <div class="duas-logo-badge">🤲</div>
          <div class="duas-title-group">
            <h1>دعاؤں کا قرآنی انسائیکلوپیڈیا • Quranic Duas Encyclopedia</h1>
            <p>78 Canonical Quranic Supplications with Occasions, Spiritual Virtues & Asbab al-Nuzul</p>
          </div>
        </a>

        <div style="display: flex; align-items: center; gap: 8px;">
          <a href="index.html#ayahs" class="duas-back-btn">
            <span>📖 Deep Quran Analyzer</span>
            <span>↗</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="duas-main-container">
    
    <!-- Consolidated Executive Toolbar & Controls (Finding F-09) -->
    <div class="duas-toolbar-wrap duas-executive-toolbar">
      <!-- Row 1: Universal Search & Executive Controls -->
      <div class="duas-search-row">
        <div class="duas-search-input-wrap">
          <span class="duas-search-icon">🔍</span>
          <input type="text" id="duas-search-input" class="duas-search-input" placeholder="Search Duas: shifa, rizq, aulad, parents, rabbana, forgiveness, 2:201..." autocomplete="off">
          <button type="button" id="duas-search-clear" class="duas-search-clear" title="Clear Search">✕</button>
        </div>
        <div id="duas-count-badge" class="duas-badge-counter">78 Duas (دعائیں)</div>
      </div>

      <!-- Row 2: Quick Filter Pills, Dropdowns, Font Controls & Dual Modes -->
      <div class="duas-controls-row">
        <!-- Quick Navigation Pills -->
        <div class="duas-controls-left">
          <div class="duas-filter-strip" style="padding-bottom: 0;">
            <button type="button" class="duas-pill-btn active" data-filter="all">
              <span>سب دعائیں (All 78)</span>
            </button>
            <button type="button" class="duas-pill-btn" data-filter="40_rabbana">
              <span>۴۰ ربنا (40)</span>
            </button>
            <button type="button" class="duas-pill-btn" data-filter="starred">
              <span>⭐ پسندیدہ</span>
            </button>
          </div>

          <!-- 9 Life Needs Dropdown -->
          <select id="duas-cat-select" class="duas-dropdown-select" aria-label="Select Life Need">
            <option value="all">🏷️ سب شعبہ جات (All 9 Needs)</option>
            <option value="forgiveness">🕊️ مغفرت و توبہ (Forgiveness)</option>
            <option value="guidance">🧭 ہدایت و استقامت (Guidance)</option>
            <option value="family">👨‍👩‍👧‍👦 اہل و عیال و والدین (Family)</option>
            <option value="healing">🩺 شفاء و مصائب (Healing)</option>
            <option value="sustenance">🌾 رزقِ حلال (Sustenance)</option>
            <option value="protection">🛡️ حفاظت و نصرت (Protection)</option>
            <option value="knowledge">📖 علم و حکمت (Knowledge)</option>
            <option value="good_ending">🌅 حسنِ خاتمہ (Good Ending)</option>
            <option value="praise">✨ حمد و شکر (Praise)</option>
          </select>

          <!-- 12 Prophets Dropdown -->
          <select id="duas-prophet-select" class="duas-dropdown-select" aria-label="Select Prophet">
            <option value="all">👳 سب انبیاء (All Prophets)</option>
            <option value="adam">آدم علیہ السلام</option>
            <option value="nuh">نوح علیہ السلام</option>
            <option value="ibrahim">ابراہیم علیہ السلام</option>
            <option value="yusuf">یوسف علیہ السلام</option>
            <option value="musa">موسیٰ علیہ السلام</option>
            <option value="yunus">یونس علیہ السلام</option>
            <option value="ayyub">ایوب علیہ السلام</option>
            <option value="zakariya">زکریا علیہ السلام</option>
            <option value="suleiman">سلیمان علیہ السلام</option>
            <option value="isa">عیسیٰ علیہ السلام</option>
            <option value="muhammad">نبی کریم ﷺ</option>
          </select>
        </div>

        <!-- Typography & Dual-Mode Controls -->
        <div class="duas-controls-right">
          <!-- Font Size Scaler -->
          <div class="duas-controls-group" title="Adjust Arabic & Urdu Typography Scale">
            <button type="button" id="dua-font-dec" class="duas-ctrl-btn" title="Decrease font size">A−</button>
            <span id="dua-font-scale-val" class="dua-font-scale-val" style="font-size: 0.76rem; font-weight: 700; color: #94a3b8; padding: 0 4px; min-width: 38px; text-align: center;">100%</span>
            <button type="button" id="dua-font-inc" class="duas-ctrl-btn" title="Increase font size">A+</button>
            <button type="button" id="dua-font-reset" class="duas-ctrl-btn" title="Reset font scale" style="padding: 4px 6px;">⟲</button>
          </div>

          <!-- Font Typeface Switcher -->
          <button type="button" id="dua-font-toggle" class="duas-ctrl-btn dua-font-toggle-btn" title="Switch Urdu Font: Nastaleeq vs Naskh">
            <span>🖋️ نستعلیق</span>
          </button>

          <!-- Executive Dual Mode -->
          <div class="duas-controls-group" title="Switch Presentation Mode">
            <button type="button" class="duas-ctrl-btn dua-mode-btn active" data-mode="devotional" title="Clean Devotional Reading">
              <span>📖 عقیدت</span>
            </button>
            <button type="button" class="duas-ctrl-btn dua-mode-btn" data-mode="study" title="Full Exegesis & Scholarly Tiers">
              <span>🔬 مطالعہ</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Mount Container for Dua Cards -->
    <section id="duas-list-mount" class="duas-list-container"></section>
    <div id="duas-scroll-sentinel" style="height: 40px; width: 100%;"></div>

  </main>

  <!-- Audio Mini Dock -->
  <aside id="duas-audio-dock" class="dua-audio-dock">
    <div class="dua-dock-meta">
      <span style="font-size: 1.4rem;">🎙️</span>
      <div>
        <div class="dock-dua-title" style="font-weight: 700; color: #fbbf24; font-size: 0.90rem;">تلاوت قرآنِ کریم</div>
        <div style="font-size: 0.75rem; color: #94a3b8;">قاری مشاری راشد العفاسی (Mishary Rashid Alafasy)</div>
      </div>
    </div>

    <div class="dua-dock-controls">
      <button type="button" class="dua-dock-btn main-play" onclick="DuasEngine.togglePlayPause()" title="Play / Pause">▶</button>
      <button type="button" class="dua-dock-btn" onclick="DuasEngine.closeAudioDock()" title="Close Mini Player">✕</button>
    </div>
  </aside>

  <!-- Load Assets & Engine -->
  <script src="js/waqf-engine.js?v=20261107_rev3"></script>
  <script src="data/quran_duas_data.js?v=20261107_rev3"></script>
  <script src="js/duas-engine.js?v=20261107_rev3"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.DuasEngine) {
        window.DuasEngine.init();
      }
    });
  </script>
</body>
</html>
