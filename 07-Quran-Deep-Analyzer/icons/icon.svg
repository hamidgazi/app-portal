<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="70%" stop-color="#0a1e17" />
      <stop offset="100%" stop-color="#020806" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Emerald Outer Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#gold)" stroke-width="3" stroke-opacity="0.35" />

  <!-- Sacred 8-Point Geometric Islamic Star (Rub El Hizb) -->
  <g transform="translate(256,256) scale(0.92)" stroke="url(#gold)" stroke-width="4" fill="none" opacity="0.65">
    <rect x="-140" y="-140" width="280" height="280" rx="12" />
    <rect x="-140" y="-140" width="280" height="280" rx="12" transform="rotate(45)" />
  </g>

  <!-- Inner Soft Aura -->
  <circle cx="256" cy="256" r="130" fill="#047857" opacity="0.25" filter="url(#glow)" />

  <!-- Open Quran Book Calligraphic Silhouette -->
  <g transform="translate(256, 260) scale(1.1)" filter="url(#glow)">
    <!-- Book Left Page -->
    <path d="M-10,35 C-45,25 -95,20 -115,40 C-120,42 -122,5 -122,-45 C-100,-60 -50,-65 -10,-48 Z" fill="url(#gold)" opacity="0.95" />
    <!-- Book Right Page -->
    <path d="M10,35 C45,25 95,20 115,40 C120,42 122,5 122,-45 C100,-60 50,-65 10,-48 Z" fill="url(#goldLight)" opacity="0.95" />

    <!-- Center Spine & Binding Ribbon -->
    <path d="M0,-52 L0,50" stroke="#78350f" stroke-width="6" stroke-linecap="round" />
    <path d="M0,45 Q-15,85 -30,105" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" />

    <!-- Sacred Text Engraving Lines -->
    <path d="M-95,-30 C-65,-40 -35,-32 -25,-25 M-95,-10 C-65,-20 -35,-12 -25,-5 M-95,10 C-65,0 -35,8 -25,15" stroke="#0a1e17" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />
    <path d="M95,-30 C65,-40 35,-32 25,-25 M95,-10 C65,-20 35,-12 25,-5 M95,10 C65,0 35,8 25,15" stroke="#0a1e17" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- Crown Ayah Rosette & Crescent -->
  <g transform="translate(256, 125) scale(0.65)" fill="url(#gold)" filter="url(#glow)">
    <circle cx="0" cy="0" r="16" />
    <polygon points="0,-28 8,-12 26,-12 12,-2 18,16 0,6 -18,16 -12,-2 -26,-12 -8,-12" />
  </g>
</svg>