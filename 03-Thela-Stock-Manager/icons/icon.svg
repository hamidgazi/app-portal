<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1424"/>
      <stop offset="50%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="inGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="outGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas (Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4"/>

  <!-- Main Crate / Cart Graphic -->
  <g filter="url(#glow)">
    <!-- Crate Base -->
    <rect x="106" y="160" width="300" height="220" rx="24" fill="#151f32" stroke="url(#boxGrad)" stroke-width="4"/>
    <!-- Crate Diagonal Braces -->
    <line x1="112" y1="166" x2="398" y2="374" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4"/>
    <line x1="398" y1="166" x2="112" y2="374" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4"/>
    <!-- Central Slat / Plate -->
    <rect x="156" y="230" width="200" height="80" rx="12" fill="#0b1220" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>
    <!-- Text THELA -->
    <text x="256" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="#f1f5f9" text-anchor="middle" letter-spacing="4">THELA</text>
  </g>

  <!-- Stock IN Badge (Top Left) -->
  <g>
    <rect x="106" y="96" width="136" height="46" rx="23" fill="url(#inGrad)"/>
    <text x="174" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">+ IN</text>
  </g>

  <!-- Stock OUT Badge (Top Right) -->
  <g>
    <rect x="270" y="96" width="136" height="46" rx="23" fill="url(#outGrad)"/>
    <text x="338" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">− OUT</text>
  </g>

  <!-- Wheels / Rollers -->
  <circle cx="170" cy="412" r="26" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3"/>
  <circle cx="170" cy="412" r="10" fill="#0f172a"/>
  <circle cx="342" cy="412" r="26" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3"/>
  <circle cx="342" cy="412" r="10" fill="#0f172a"/>
  <line x1="196" y1="412" x2="316" y2="412" stroke="rgba(255, 255, 255, 0.3)" stroke-width="6" stroke-linecap="round"/>
</svg>
