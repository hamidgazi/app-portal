<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Roman Naat Studio — Instant Search & Recitation Deck</title>
    <meta name="description" content="Instant phonetic search across canonical Bareilly Sharif Roman Naat books with English translations, WhatsApp sharing, and recitation deck.">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="studio-header">
        <div class="header-inner">
            <div class="brand-section" onclick="location.reload()">
                <div class="brand-icon">✨</div>
                <div class="brand-text">
                    <h1>Roman Naat Studio <span class="brand-badge">Bareilly Diwans</span></h1>
                    <p>Instant Search Across 4 Canonical Naat Books</p>
                </div>
            </div>

            <div class="nav-actions">
                <button class="nav-btn" id="theme-toggle-btn" title="Toggle Dark/Light Reading Mode" aria-label="Toggle Theme">
                    <span id="theme-icon">☀️</span>
                </button>
                <button class="nav-btn" id="audio-toggle-btn" title="Toggle Acoustic UI Clicks (No Music)" aria-label="Toggle Audio">
                    <span id="audio-icon">🔊</span>
                </button>
                <button class="nav-btn" id="browser-toggle-btn" title="Open Complete Book Index / Table of Contents">
                    📚 Book Index
                </button>
                <button class="nav-btn" id="deck-toggle-btn" title="Open Recitation Deck (Saved Shers)">
                    ⭐ Deck <span class="badge-count" id="deck-badge">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Search Hero & Filters -->
    <section class="search-hero">
        <div class="search-box-wrap">
            <span class="search-icon-left">🔍</span>
            <input type="text" 
                   id="search-input" 
                   class="search-input-box" 
                   placeholder="Search any Naat, misra, or word in English / Roman (e.g. Mustafa, Jood o karam, Ghaus, Taajush Shariah)..." 
                   autocomplete="off" 
                   spellcheck="false" 
                   autofocus>
            <button id="search-clear-btn" class="search-clear-btn" title="Clear Search">✕</button>
        </div>

        <!-- Search Mode Toggle Bar (Shers vs Full Kalams) -->
        <div class="mode-toggle-bar" role="tablist" aria-label="Search and Reading Mode">
            <button class="mode-btn active" id="mode-shers-btn" data-mode="shers" role="tab" aria-selected="true">
                <span class="mode-icon">📝</span> Couplets (Shers) <span class="mode-count" id="mode-sher-count">7,766</span>
            </button>
            <button class="mode-btn" id="mode-kalams-btn" data-mode="kalams" role="tab" aria-selected="false">
                <span class="mode-icon">📖</span> Full Naats (Kalams) <span class="mode-count" id="mode-kalam-count">346</span>
            </button>
        </div>

        <!-- Book Scope Filter Pills -->
        <div class="filter-row">
            <span class="filter-group-label">Books:</span>
            <button class="pill-btn active" data-book="all">All 4 Books</button>
            <button class="pill-btn" data-book="hadaiq">📗 Hadaiq-e-Bakhshish</button>
            <button class="pill-btn" data-book="saaman">📘 Saamaan-e-Bakhshish</button>
            <button class="pill-btn" data-book="safeena">📙 Safeena-e-Bakhshish</button>
            <button class="pill-btn" data-book="zauq">📕 Zauq-e-Na'at</button>
        </div>

        <!-- Category Filter Pills -->
        <div class="filter-row category-filter-row">
            <span class="filter-group-label">Category:</span>
            <button class="pill-btn cat-btn active" data-cat="all">All Genres</button>
            <button class="pill-btn cat-btn" data-cat="Naat">Naat Shareef</button>
            <button class="pill-btn cat-btn" data-cat="Hamd">Hamd-e-Baari</button>
            <button class="pill-btn cat-btn" data-cat="Manqabat">Manqabat</button>
            <button class="pill-btn cat-btn" data-cat="Salaam">Salaam</button>
            <button class="pill-btn cat-btn" data-cat="Munajat">Munajat</button>
            <button class="pill-btn cat-btn" data-cat="Rubai">Rubai / Qit'a</button>
        </div>

        <!-- Live Search Status Counter -->
        <div class="search-status-bar">
            <div id="result-status-text">Displaying shers across Bareilly Divans</div>
            <div style="font-size: 0.78rem; color: var(--text-muted);">Diacritic & Phonetic Tolerant</div>
        </div>
    </section>

    <!-- Main Results Container -->
    <main class="main-container">
        <div id="results-container">
            <div id="results-grid" class="results-grid">
                <!-- Dynamically populated via js/app.js -->
            </div>
        </div>

        <!-- Book Browser Container (Table of Contents View) -->
        <div id="browser-container" class="browser-section">
            <!-- Dynamically populated via js/app.js -->
        </div>
    </main>

    <!-- Dedicated Full-Page Diwan Reader View (Zero Modal, Edge-to-Edge) -->
    <section id="diwan-reader-view" class="diwan-reader-view" style="display: none;">
        <!-- Sticky Diwan Header -->
        <header class="diwan-sticky-header">
            <div class="diwan-header-top">
                <button id="diwan-back-btn" class="diwan-back-btn" title="Back to Search Results">
                    ← Back to Search
                </button>
                <div class="diwan-title-meta">
                    <h2 id="diwan-title">Kalam Title</h2>
                    <div class="diwan-sub-meta">
                        <span id="diwan-book-badge" class="tag-badge book-badge">📖 Book Title</span>
                        <span id="diwan-author-badge" class="diwan-author-tag">✍️ Author</span>
                        <span id="diwan-page-badge" class="tag-badge page-badge">Pg. 1</span>
                        <span id="diwan-verse-count" class="kalam-verse-count-badge">0 Couplets</span>
                    </div>
                </div>
                <div class="diwan-header-actions">
                    <button id="diwan-whatsapp-btn" class="action-btn-primary" title="Share Complete Naat to WhatsApp">
                        📲 WhatsApp
                    </button>
                    <button id="diwan-copy-btn" class="action-btn-secondary" title="Copy Entire Naat">
                        📋 Copy All
                    </button>
                </div>
            </div>

            <!-- Diwan Controls & Navigation Ribbon -->
            <div class="diwan-header-controls">
                <div class="diwan-nav-chapters">
                    <button id="diwan-prev-btn" class="diwan-ctrl-btn" title="Previous Naat in Book">
                        ⬅️ Prev Naat
                    </button>
                    <span id="diwan-chap-indicator" class="diwan-chap-indicator">Kalam 1 of 124</span>
                    <button id="diwan-next-btn" class="diwan-ctrl-btn" title="Next Naat in Book">
                        Next Naat ➡️
                    </button>
                </div>
                <div class="diwan-display-options">
                    <button id="diwan-cols-btn" class="diwan-ctrl-btn" title="Toggle 2 Columns / 1 Column">
                        🔲 2-Column
                    </button>
                    <button id="diwan-trans-btn" class="diwan-ctrl-btn active" title="Toggle English Translation">
                        <span class="toolbar-icon">🔤</span> <span id="diwan-trans-label">Translation: ON</span>
                    </button>
                    <div class="diwan-zoom-group">
                        <button id="diwan-zoom-out" class="diwan-zoom-btn" title="Decrease Font Size">A-</button>
                        <button id="diwan-zoom-in" class="diwan-zoom-btn" title="Increase Font Size">A+</button>
                    </div>
                    <button id="diwan-bookmark-btn" class="diwan-ctrl-btn" title="Bookmark this Naat">
                        ⭐ <span id="diwan-bookmark-label">Bookmark</span>
                    </button>
                    <button id="diwan-share-link-btn" class="diwan-ctrl-btn" title="Copy Direct Link to this Naat">
                        🔗 Share Link
                    </button>
                </div>
            </div>
        </header>

        <!-- Diwan Body & Multi-Column Verses -->
        <main class="diwan-body-wrap">
            <div id="diwan-intro-note" class="kalam-intro-note" style="display: none;"></div>
            <div id="diwan-verses-container" class="diwan-verses-flow cols-2">
                <!-- Continuous couplets populated dynamically -->
            </div>
            <div id="diwan-footnote" class="kalam-footnote" style="display: none;"></div>

            <!-- Bottom Navigation Bar -->
            <div class="diwan-bottom-bar">
                <button class="diwan-back-btn" onclick="window.App.closeDiwanReader()">
                    ← Back to Search Results
                </button>
                <div class="diwan-nav-chapters">
                    <button class="diwan-ctrl-btn" onclick="window.App.navigateSequentialKalam(-1)">
                        ⬅️ Previous Naat
                    </button>
                    <button class="diwan-ctrl-btn" onclick="window.App.navigateSequentialKalam(1)">
                        Next Naat ➡️
                    </button>
                </div>
            </div>
        </main>
    </section>

    <!-- Recitation Deck Slide-Over Drawer -->
    <div id="deck-backdrop" class="drawer-backdrop"></div>
    <aside id="deck-drawer" class="drawer-panel" role="complementary" aria-label="Recitation Deck">
        <div class="drawer-header">
            <h3>⭐ Recitation Deck <span id="deck-count-text" style="font-size: 0.85rem; color: var(--text-secondary);">(0 Saved)</span></h3>
            <div style="display: flex; align-items: center; gap: 8px;">
                <div class="recite-zoom-controls">
                    <button id="zoom-out-btn" class="zoom-btn" title="Decrease Recitation Font Size">A-</button>
                    <button id="zoom-in-btn" class="zoom-btn" title="Increase Recitation Font Size">A+</button>
                </div>
                <button id="deck-close-btn" class="modal-close-btn" style="min-width: 36px; min-height: 36px; font-size: 16px;" title="Close Deck">✕</button>
            </div>
        </div>

        <!-- Recitation Deck Tab Switcher -->
        <div class="deck-tabs">
            <button id="deck-tab-shers" class="deck-tab-btn active">
                ⭐ Couplets (<span id="deck-sher-tab-count">0</span>)
            </button>
            <button id="deck-tab-kalams" class="deck-tab-btn">
                📖 Full Naats (<span id="deck-kalam-tab-count">0</span>)
            </button>
        </div>

        <div id="deck-body" class="drawer-body">
            <!-- Bookmarked shers or kalams rendered here -->
        </div>
    </aside>

    <!-- Toast Notification -->
    <div id="toast-notice" class="toast-notice" role="status" aria-live="polite">Notification</div>

    <!-- Application Scripts -->
    <script src="data/naat_library_data.js"></script>
    <script src="js/audio-sfx.js"></script>
    <script src="js/search-engine.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
