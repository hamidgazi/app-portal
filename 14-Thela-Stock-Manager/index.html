<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Thela Stock Manager</title>
  
  <!-- PWA Meta -->
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Thela Stock">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Vendor SheetJS (Offline Local Bundle) -->
  <script src="vendor/xlsx.full.min.js"></script>

  <!-- Firebase v8 Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    /* ==========================================================================
       AMOLED PURE BLACK DESIGN SYSTEM & ERGONOMIC RESILIENCE
       ========================================================================== */
    :root {
      --bg-canvas: #000000;
      --bg-surface: #0e1424;
      --bg-surface-elevated: #151e34;
      --bg-surface-hover: #1c2742;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: #38bdf8;
      
      /* Typography (Soft warm off-white to prevent OLED purple smear) */
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      
      /* Accents */
      --accent-out: #f43f5e;
      --accent-out-bg: rgba(244, 63, 94, 0.15);
      --accent-out-glow: rgba(244, 63, 94, 0.35);
      
      --accent-in: #10b981;
      --accent-in-bg: rgba(16, 185, 129, 0.15);
      --accent-in-glow: rgba(16, 185, 129, 0.35);

      --accent-cyan: #38bdf8;
      --accent-amber: #f59e0b;
      
      /* Physics */
      --spring: cubic-bezier(0.16, 1, 0.3, 1);
      --min-hitbox: 48px;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-pill: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: max(12px, env(safe-area-inset-top, 0px));
      padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
      padding-left: max(12px, env(safe-area-inset-left, 0px));
      padding-right: max(12px, env(safe-area-inset-right, 0px));
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .app-container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ==========================================================================
       ZONE 1: PASSIVE APP BAR & DIAGNOSTICS
       ========================================================================== */
    .top-app-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      gap: 10px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: var(--min-hitbox);
      min-height: var(--min-hitbox);
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s var(--spring), background-color 0.15s;
    }

    .btn-back:active {
      transform: scale(0.96);
    }

    .brand-title-wrap {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-subtitle {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.2px;
    }

    .app-bar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-in);
      box-shadow: 0 0 8px var(--accent-in);
    }

    .status-dot.offline {
      background-color: var(--accent-amber);
      box-shadow: 0 0 8px var(--accent-amber);
    }

    .queue-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 800;
      background: rgba(245, 158, 11, 0.2);
      color: var(--accent-amber);
      border-radius: var(--radius-pill);
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .btn-icon-action {
      min-width: var(--min-hitbox);
      min-height: var(--min-hitbox);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-size: 16px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s var(--spring), background-color 0.15s, border-color 0.15s;
    }

    .btn-icon-action:active {
      transform: scale(0.96);
      background: var(--bg-surface-hover);
    }

    /* Header action toolbar */
    .quick-toolbar {
      display: flex;
      gap: 8px;
    }

    .btn-tool {
      flex: 1;
      min-height: var(--min-hitbox);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s var(--spring), border-color 0.15s;
    }

    .btn-tool:active {
      transform: scale(0.97);
      border-color: var(--border-active);
    }

    /* ==========================================================================
       BANNER: LOW STOCK ALERT
       ========================================================================== */
    .low-stock-banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: var(--accent-out-bg);
      border: 1px solid var(--accent-out);
      border-radius: var(--radius-md);
      color: #fecdd3;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      animation: pulseGlow 2s infinite ease-in-out;
    }

    .low-stock-banner.active {
      display: flex;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 10px var(--accent-out-glow); }
      50% { box-shadow: 0 0 20px var(--accent-out-glow); }
    }

    /* ==========================================================================
       ZONE 2: 6 REAL-TIME STOCK BALANCE CARDS
       ========================================================================== */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-secondary);
    }

    .total-stock-badge {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.12);
      padding: 4px 8px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (min-width: 520px) {
      .cards-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Ergonomic Whole-Card Click Delegation */
    .stock-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.15s var(--spring), border-color 0.15s, background-color 0.15s, box-shadow 0.15s;
      min-height: 104px;
    }

    .stock-card:active {
      transform: scale(0.97);
      background: var(--bg-surface-hover);
    }

    .stock-card.selected {
      border-color: var(--accent-cyan);
      background: var(--bg-surface-elevated);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
    }

    .stock-card.zero-stock {
      border-color: var(--accent-out);
      background: rgba(244, 63, 94, 0.08);
      animation: alertBorderPulse 2.5s infinite ease-in-out;
    }

    @keyframes alertBorderPulse {
      0%, 100% { border-color: rgba(244, 63, 94, 0.5); }
      50% { border-color: rgba(244, 63, 94, 1); box-shadow: 0 0 12px var(--accent-out-glow); }
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-item-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: var(--radius-pill);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .card-badge.ok {
      background: var(--accent-in-bg);
      color: var(--accent-in);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .card-badge.empty {
      background: var(--accent-out-bg);
      color: var(--accent-out);
      border: 1px solid rgba(244, 63, 94, 0.5);
    }

    .card-balance {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .card-balance.zero {
      color: var(--accent-out);
    }

    .card-breakdown {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 6px;
      margin-top: 2px;
    }

    .breakdown-in {
      color: var(--accent-in);
    }

    .breakdown-out {
      color: var(--accent-out);
    }

    /* ==========================================================================
       ZONE 3: TRANSACTION INPUT CONSOLE
       ========================================================================== */
    .input-console-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* IN / OUT Toggle Switch */
    .type-toggle-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--bg-surface-elevated);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
    }

    .type-toggle-btn {
      min-height: var(--min-hitbox);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 800;
      border: none;
      border-radius: 10px;
      color: var(--text-secondary);
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.18s var(--spring);
    }

    .type-toggle-btn:active {
      transform: scale(0.97);
    }

    .type-toggle-btn.active-out {
      background: var(--accent-out);
      color: #ffffff;
      box-shadow: 0 0 14px var(--accent-out-glow);
    }

    .type-toggle-btn.active-in {
      background: var(--accent-in);
      color: #ffffff;
      box-shadow: 0 0 14px var(--accent-in-glow);
    }

    /* 6 Item Selection Matrix */
    .form-group-label {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .item-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .item-btn {
      min-height: var(--min-hitbox);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s var(--spring), border-color 0.15s, background-color 0.15s;
    }

    .item-btn:active {
      transform: scale(0.96);
    }

    .item-btn.selected {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent-cyan);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    /* Quantity Presets */
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .preset-btn {
      min-height: var(--min-hitbox);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-surface-elevated);
      color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s var(--spring), background-color 0.15s, border-color 0.15s;
    }

    .preset-btn:active {
      transform: scale(0.95);
      background: rgba(56, 189, 248, 0.25);
    }

    /* Custom Quantity & Details Input */
    .qty-input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-input-box {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .qty-input {
      width: 100%;
      min-height: var(--min-hitbox);
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-size: 20px;
      font-weight: 800;
      padding: 8px 44px 8px 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    .qty-input:focus {
      border-color: var(--accent-cyan);
    }

    .btn-clear-qty {
      position: absolute;
      right: 4px;
      min-width: 40px;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 16px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .tx-meta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .text-input {
      min-height: var(--min-hitbox);
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 12px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    .text-input:focus {
      border-color: var(--accent-cyan);
    }

    /* Submit Button */
    .btn-submit {
      min-height: 56px;
      width: 100%;
      border: none;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s var(--spring), background-color 0.15s, box-shadow 0.15s;
      color: #ffffff;
      background: var(--accent-out);
      box-shadow: 0 4px 16px var(--accent-out-glow);
    }

    .btn-submit.mode-in {
      background: var(--accent-in);
      box-shadow: 0 4px 16px var(--accent-in-glow);
    }

    .btn-submit:active {
      transform: scale(0.97);
    }

    /* ==========================================================================
       ZONE 4: RECENT TRANSACTIONS STREAM
       ========================================================================== */
    .history-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .filter-select {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      outline: none;
      cursor: pointer;
    }

    .tx-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* Custom scrollbar */
    .tx-list::-webkit-scrollbar {
      width: 6px;
    }
    .tx-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .tx-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    .tx-item {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .tx-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tx-type-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      min-width: 44px;
    }

    .tx-type-pill.out {
      background: var(--accent-out-bg);
      color: var(--accent-out);
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .tx-type-pill.in {
      background: var(--accent-in-bg);
      color: var(--accent-in);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .tx-info {
      display: flex;
      flex-direction: column;
    }

    .tx-item-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .tx-item-meta {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .tx-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .tx-qty {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .tx-sync-status {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .tx-sync-status.synced {
      color: var(--accent-cyan);
    }

    .tx-sync-status.queued {
      color: var(--accent-amber);
    }

    /* Toast Notification System */
    .toast-container {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 9999;
      pointer-events: none;
      width: 90%;
      max-width: 420px;
    }

    .toast {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.25s var(--spring);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.success {
      border-left: 4px solid var(--accent-in);
    }

    .toast.warning {
      border-left: 4px solid var(--accent-amber);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- ZONE 1: TOP APP BAR & DIAGNOSTICS -->
    <header class="top-app-bar">
      <div class="brand-section">
        <a id="header-back-btn" href="../../Common-Resources/App-Portal/index.html" class="btn-back" title="Back to App Portal">←</a>
        <div class="brand-title-wrap">
          <h1 class="brand-title">📦 Thela Stock</h1>
          <span class="brand-subtitle">Real-Time Mobile Ledger</span>
        </div>
      </div>

      <div class="app-bar-actions">
        <div id="status-badge" class="status-pill" title="Cloud Sync Status">
          <span id="status-dot" class="status-dot"></span>

    /* ==========================================================================
       3. WEB AUDIO API MICRO-HAPTICS ENGINE
       ========================================================================== */
    class MicroHapticsEngine {
      constructor() {
        this.ctx = null;
        this.initUnlock();
      }

      initUnlock() {
        const unlock = () => {
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx && !this.ctx) {
              this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === 'suspended') {
              this.ctx.resume();
            }
          } catch (e) {
            console.warn('[Haptics] AudioContext unlock warning:', e);
          }
          window.removeEventListener('pointerdown', unlock);
          window.removeEventListener('touchstart', unlock);
        };
        window.addEventListener('pointerdown', unlock, { passive: true });
        window.addEventListener('touchstart', unlock, { passive: true });
      }

      playPop() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.18, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.07);
        } catch (e) {
          console.warn('[Haptics] Pop warning:', e);
        }
      }

      playToggle() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(360, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.12);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.15, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        } catch (e) {
          console.warn('[Haptics] Toggle warning:', e);
        }
      }

      playCelebration() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const now = this.ctx.currentTime;
          const notes = [
            { f: 523.25, start: 0.00, dur: 0.12 },
            { f: 659.25, start: 0.08, dur: 0.14 },
            { f: 783.99, start: 0.16, dur: 0.20 },
            { f: 1046.50, start: 0.24, dur: 0.35 }
          ];
          notes.forEach(n => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(n.f, now + n.start);
            gain.gain.setValueAtTime(0.0001, now + n.start);
            gain.gain.exponentialRampToValueAtTime(0.18, now + n.start + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + n.start + n.dur);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + n.start);
            osc.stop(now + n.start + n.dur + 0.02);
          });
        } catch (e) {
          console.warn('[Haptics] Celebration warning:', e);
        }
      }
    }

    /* ==========================================================================

    const State = {
      currentType: 'OUT', // 'OUT' or 'IN'
      selectedItem: '1 set',
      quantity: 50,
      stockBalances: {},
      transactions: [],
      offlineQueue: [],
      isOnline: navigator.onLine,
      db: null

    function initStateStore() {
      // Initialize default date in input
      if (UI['tx-date-input']) {
        const today = new Date().toISOString().slice(0, 10);
        UI['tx-date-input'].value = today;
      }

      // Load local transactions & offline queue from localStorage
      loadFromLocalStorage();

      // Recalculate balances
      recalculateStockBalances();
    }

    function loadFromLocalStorage() {
      try {
        const rawQueue = localStorage.getItem(STORAGE_KEY_QUEUE);
        State.offlineQueue = rawQueue ? JSON.parse(rawQueue) : [];
      } catch (e) {
        console.warn('[Store] Local queue read error:', e);
        State.offlineQueue = [];
      }

      try {
        const rawLocal = localStorage.getItem(STORAGE_KEY_LOCAL_TX);
        const storedLocal = rawLocal ? JSON.parse(rawLocal) : [];
        
        // Merge seed transactions with stored local transactions
        const txMap = new Map();
        SEED_TRANSACTIONS.forEach(t => txMap.set(t.id || `sr_${t.sr}`, t));
        storedLocal.forEach(t => txMap.set(t.id, t));
        State.offlineQueue.forEach(t => txMap.set(t.id, t));

        State.transactions = Array.from(txMap.values());
      } catch (e) {
        console.warn('[Store] Stored local transactions read error:', e);
        State.transactions = [...SEED_TRANSACTIONS];
      }

      updateQueueBadge();
    }

    function saveToLocalStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_QUEUE, JSON.stringify(State.offlineQueue));
        
        // Filter out seed transactions to keep localStorage lean
        const customTxs = State.transactions.filter(t => t.source !== 'excel');
        localStorage.setItem(STORAGE_KEY_LOCAL_TX, JSON.stringify(customTxs));
      } catch (e) {
        console.warn('[Store] LocalStorage write error:', e);
      }
      updateQueueBadge();
    }

    function recalculateStockBalances() {
      const balances = {};
      ITEMS.forEach(item => {
        const base = BASE_SUMMARY[item] || { opStock: OPENING_STOCKS[item] || 0, stockIn: 0, stockOut: 0, currentStock: 0 };
        balances[item] = {
          opStock: base.opStock,
          stockIn: base.stockIn,
          stockOut: base.stockOut,
          currentStock: base.currentStock
        };
      });

      // Aggregate newly recorded transactions (source !== 'excel')
      State.transactions.forEach(tx => {
        if (tx.source === 'excel') return; // Already incorporated in Excel BASE_SUMMARY
        const item = tx.item;
        if (!balances[item]) return;
        const qty = Number(tx.quantity) || 0;
        if (tx.type === 'IN') {
          balances[item].stockIn += qty;
        } else if (tx.type === 'OUT') {
          balances[item].stockOut += qty;
        }
      });

      // Compute current stock = Op. Stock + Stock In - Stock Out
      let totalUnits = 0;
      let hasZeroStock = false;
      let zeroItems = [];

      ITEMS.forEach(item => {
        const b = balances[item];
        b.currentStock = b.opStock + b.stockIn - b.stockOut;
        totalUnits += b.currentStock;
        if (b.currentStock <= 0) {
          hasZeroStock = true;
          zeroItems.push(item);
        }
      });

      State.stockBalances = balances;

      // Update total badge
      if (UI['total-stock-badge']) {
        UI['total-stock-badge'].textContent = `${totalUnits.toLocaleString()} Units`;
      }

      // Update Low Stock Banner
      if (UI['banner-low-stock']) {
        if (hasZeroStock) {
          UI['banner-low-stock'].classList.add('active');
          if (UI['banner-low-stock-text']) {
            UI['banner-low-stock-text'].innerHTML = `<strong>Low Stock Alert:</strong> ${zeroItems.join(', ')} has 0 or negative units! Urgent restocking required.`;
          }
        } else {
          UI['banner-low-stock'].classList.remove('active');
        }
      }

      // Re-render balance cards & preview
      renderStockBalanceCards();
      updateFormPreview();
    }

        card.innerHTML = `
          <div class="card-top">
            <span class="card-item-name" title="${item}">${item}</span>
            <span class="card-badge ${isZero ? 'empty' : 'ok'}">${isZero ? 'EMPTY ⚠️' : 'OK'}</span>
          </div>
          <div class="card-balance ${isZero ? 'zero' : ''}">${b.currentStock.toLocaleString()}</div>
          <div class="card-breakdown">
            <span class="breakdown-in">+${b.stockIn} In</span>
            <span class="breakdown-out">-${b.stockOut} Out</span>
            <span>Op:${b.opStock}</span>
          </div>
        `;

        // Whole-Card Touch Delegation
        card.addEventListener('click', () => {
          selectItem(item);
          if (haptics) haptics.playPop();
          // Smooth scroll towards input console
          const consoleEl = document.querySelector('.input-console-card');
          if (consoleEl) {
            consoleEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        });

        container.appendChild(card);
      });
    }

    function renderTransactionHistory() {
      if (!UI['tx-history-list']) return;
      const list = UI['tx-history-list'];
      list.innerHTML = '';

      const filter = UI['filter-item-select'] ? UI['filter-item-select'].value : 'ALL';

      // Sort descending (newest first)
      const sorted = [...State.transactions].sort((a, b) => {
        const dateA = a.date || '';
        const dateB = b.date || '';
        if (dateA !== dateB) return dateB.localeCompare(dateA);
        const srA = a.sr || 0;
        const srB = b.sr || 0;
        return srB - srA;
      });

      const filtered = (filter === 'ALL')
        ? sorted
        : sorted.filter(t => t.item === filter);

      // Display up to 35 most recent
      const displayList = filtered.slice(0, 35);

      if (displayList.length === 0) {
        list.innerHTML = '<div style="padding: 16px; text-align: center; color: var(--text-muted); font-size: 13px;">No transactions recorded.</div>';
        return;
      }

      displayList.forEach(tx => {
        const itemEl = document.createElement('div');
        itemEl.className = 'tx-item';

        const isOut = (tx.type === 'OUT');
        const syncText = (tx.source === 'excel')
          ? `Excel #${tx.sr}`
          : (tx.status === 'synced' ? '☁️ Synced' : '🟡 Queued');
        const syncClass = (tx.status === 'synced' || tx.source === 'excel') ? 'synced' : 'queued';

        itemEl.innerHTML = `
          <div class="tx-left">
            <span class="tx-type-pill ${isOut ? 'out' : 'in'}">${tx.type}</span>
            <div class="tx-info">
              <span class="tx-item-title">${tx.item}</span>
              <span class="tx-item-meta">${tx.date}${tx.notes ? ' • ' + tx.notes : ''}</span>
            </div>
          </div>
          <div class="tx-right">
            <span class="tx-qty">${isOut ? '-' : '+'}${Number(tx.quantity).toLocaleString()}</span>
            <span class="tx-sync-status ${syncClass}">${syncText}</span>
          </div>
        `;
        list.appendChild(itemEl);
      });
    }

    /* ==========================================================================
       6. TOUCH INPUT CONTROLS & ERGONOMIC DELEGATIONS
       ========================================================================== */
    function initTouchControls() {
      // 1. IN / OUT Toggle
      if (UI['btn-type-out'] && UI['btn-type-in']) {
        UI['btn-type-out'].addEventListener('click', () => {
          setType('OUT');
          if (haptics) haptics.playToggle();
        });
        UI['btn-type-in'].addEventListener('click', () => {
          setType('IN');
          if (haptics) haptics.playToggle();
        });
      }

      // 2. Item Selector Buttons
      if (UI['item-selector-grid']) {
        const grid = UI['item-selector-grid'];
        grid.innerHTML = '';
        ITEMS.forEach(item => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `item-btn ${State.selectedItem === item ? 'selected' : ''}`;
          btn.setAttribute('data-item', item);
          btn.textContent = item;
          btn.addEventListener('click', () => {
            selectItem(item);
            if (haptics) haptics.playPop();
          });
          grid.appendChild(btn);
        });
      }

      // 3. Preset Buttons
      if (UI['preset-container']) {
        const presetBtns = UI['preset-container'].querySelectorAll('.preset-btn');
        presetBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            const val = parseInt(btn.getAttribute('data-val'), 10) || 0;
            addQuantity(val);
            if (haptics) haptics.playPop();
          });
        });
      }

      // 4. Custom Quantity Input & Clear
      if (UI['qty-input']) {
        UI['qty-input'].addEventListener('input', () => {
          const val = parseInt(UI['qty-input'].value, 10);
          State.quantity = isNaN(val) ? 0 : Math.max(0, val);
          updateFormPreview();
        });
      }

      if (UI['btn-qty-clear']) {
        UI['btn-qty-clear'].addEventListener('click', () => {
          if (UI['qty-input']) {
            UI['qty-input'].value = '';
            State.quantity = 0;
            updateFormPreview();
            UI['qty-input'].focus();
          }
          if (haptics) haptics.playPop();
        });
      }

      // 5. Submit Transaction Button
      if (UI['btn-submit-tx']) {
        UI['btn-submit-tx'].addEventListener('click', handleTransactionSubmit);
      }

      // 6. Recalculate button
      if (UI['btn-quick-refresh']) {
        UI['btn-quick-refresh'].addEventListener('click', () => {
          recalculateStockBalances();
          renderTransactionHistory();
          showToast('Stock balances refreshed', 'success');
          if (haptics) haptics.playPop();
        });
      }

      // 7. Filter selector
      if (UI['filter-item-select']) {
        UI['filter-item-select'].addEventListener('change', () => {
          renderTransactionHistory();
        });
      }

      // Initial form preview update
      updateFormPreview();
      renderTransactionHistory();
    }

    function setType(type) {
      State.currentType = type;
      if (UI['btn-type-out'] && UI['btn-type-in'] && UI['btn-submit-tx']) {
        if (type === 'OUT') {
          UI['btn-type-out'].className = 'type-toggle-btn active-out';
          UI['btn-type-in'].className = 'type-toggle-btn';
          UI['btn-submit-tx'].className = 'btn-submit';
        } else {
          UI['btn-type-out'].className = 'type-toggle-btn';
          UI['btn-type-in'].className = 'type-toggle-btn active-in';
          UI['btn-submit-tx'].className = 'btn-submit mode-in';
        }
      }
      updateFormPreview();
    }

    function selectItem(item) {
      State.selectedItem = item;
      if (UI['selected-item-display']) {
        UI['selected-item-display'].textContent = item;
      }
      // Update item buttons selection highlight
      if (UI['item-selector-grid']) {
        const btns = UI['item-selector-grid'].querySelectorAll('.item-btn');
        btns.forEach(btn => {
          if (btn.getAttribute('data-item') === item) {
            btn.classList.add('selected');
          } else {
            btn.classList.remove('selected');
          }
        });
      }
      // Update balance cards selection highlight
      if (UI['balance-cards-grid']) {
        const cards = UI['balance-cards-grid'].querySelectorAll('.stock-card');
        cards.forEach(card => {
          if (card.getAttribute('data-item') === item) {
            card.classList.add('selected');
          } else {
            card.classList.remove('selected');
          }
        });
      }
      updateFormPreview();
    }

    function addQuantity(val) {
      const current = parseInt(UI['qty-input'] ? UI['qty-input'].value : 0, 10) || 0;
      const next = (current === 0) ? val : (current + val);
      if (UI['qty-input']) {
        UI['qty-input'].value = next;
      }
      State.quantity = next;
      updateFormPreview();
    }

    function updateFormPreview() {
      const b = State.stockBalances[State.selectedItem] || { currentStock: 0 };
      if (UI['current-stock-preview']) {
        UI['current-stock-preview'].textContent = `Bal: ${b.currentStock.toLocaleString()}`;
      }
      if (UI['btn-submit-label']) {
        const verb = (State.currentType === 'OUT') ? 'OUT (Dispatch)' : 'IN (Received)';
        const qty = State.quantity || 0;
        UI['btn-submit-label'].textContent = `Record ${verb}: ${qty} × ${State.selectedItem}`;
      }
      if (UI['btn-submit-icon']) {
        UI['btn-submit-icon'].textContent = (State.currentType === 'OUT') ? '🚀' : '📥';
      }
    }

    /* ==========================================================================
       7. TRANSACTION SUBMISSION & OFFLINE QUEUE
       ========================================================================== */
    function handleTransactionSubmit() {
      const qty = parseInt(UI['qty-input'] ? UI['qty-input'].value : 0, 10);
      if (!qty || qty <= 0) {
        showToast('Please specify a quantity greater than 0', 'warning');
        if (haptics) haptics.playToggle();
        if (UI['qty-input']) UI['qty-input'].focus();
        return;
      }

      const item = State.selectedItem;
      const type = State.currentType;
      const dateVal = UI['tx-date-input'] ? UI['tx-date-input'].value : new Date().toISOString().slice(0, 10);
      const notes = UI['tx-notes-input'] ? UI['tx-notes-input'].value.trim() : '';

      // Create transaction object
      const tx = {
        id: `tx_${Date.now()}_${Math.random().toString(36).substring(2, 8)}`,
        date: dateVal,
        item: item,
        quantity: qty,
        type: type,
        timestamp: new Date().toISOString(),
        source: 'mobile_pwa',
        excel_sr: null,
        synced_to_excel: false,
        notes: notes,
        status: 'pending'
      };

      // Optimistically push to state
      State.transactions.unshift(tx);
      State.offlineQueue.push(tx);

      // Save to localStorage
      saveToLocalStorage();

      // Recalculate & re-render
      recalculateStockBalances();
      renderTransactionHistory();

      // Play celebration chord
      if (haptics) haptics.playCelebration();

      // Show toast
      showToast(`Recorded ${type}: ${qty} × ${item}`, 'success');

      // Reset notes and reset quantity to 50
      if (UI['tx-notes-input']) UI['tx-notes-input'].value = '';
      if (UI['qty-input']) UI['qty-input'].value = '50';
      State.quantity = 50;
      updateFormPreview();

      // Attempt cloud sync if online
      if (navigator.onLine && State.db) {
        flushOfflineQueue();
      }
    }

    function updateQueueBadge() {
      const count = State.offlineQueue.length;
      if (UI['queue-badge']) {
        UI['queue-badge'].textContent = `${count} Queued`;
        UI['queue-badge'].style.display = (count > 0) ? 'inline-flex' : 'none';
      }
    }

    function initOfflineQueueManager() {
      updateQueueBadge();

      // Listen for network state changes
      window.addEventListener('online', () => {
        updateOnlineStatus(true, 'Online');
        showToast('Network restored. Syncing queue...', 'success');
        flushOfflineQueue();
      });

      window.addEventListener('offline', () => {
        updateOnlineStatus(false, 'Offline');
        showToast('Offline Mode. Transactions queued locally.', 'warning');
      });

      // Manual sync button
      if (UI['btn-sync-now']) {
        UI['btn-sync-now'].addEventListener('click', () => {
          if (haptics) haptics.playPop();
          if (navigator.onLine) {
            flushOfflineQueue();
            showToast('Syncing with Firestore...', 'success');
          } else {
            showToast('Device is offline. Queued locally.', 'warning');
          }
        });
      }

      // Periodic queue flush check (every 20 seconds)
      setInterval(() => {
        if (navigator.onLine && State.offlineQueue.length > 0) {
          flushOfflineQueue();
        }
      }, 20000);
    }

    function updateOnlineStatus(isOnline, text) {
      State.isOnline = isOnline;
      if (UI['status-text']) UI['status-text'].textContent = text;
      if (UI['status-dot']) {
        if (isOnline) {
          UI['status-dot'].classList.remove('offline');
        } else {
          UI['status-dot'].classList.add('offline');
        }
      }
    }

    /* ==========================================================================
       8. FIREBASE FIRESTORE REALTIME SYNC ENGINE
       ========================================================================== */
    function initFirebaseSyncEngine() {
      if (typeof firebase === 'undefined') {
        console.warn('[Firebase] SDK unavailable. Running local mode.');
        updateOnlineStatus(false, 'Local Offline');
        return;
      }

      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(FIREBASE_CONFIG);
        }
        State.db = firebase.firestore();

        updateOnlineStatus(true, 'Online');

        // Listen for real-time transactions
        State.db.collection('thela_stock_transactions')
          .orderBy('timestamp', 'desc')
          .limit(100)
          .onSnapshot(snapshot => {
            let changed = false;
            const existingMap = new Map();
            State.transactions.forEach(t => existingMap.set(t.id, t));

            snapshot.docChanges().forEach(change => {
              const data = change.doc.data();
              if (change.type === 'added' || change.type === 'modified') {
                existingMap.set(data.id || change.doc.id, {
                  ...data,
                  status: 'synced'
                });
                changed = true;
              }
            });

            if (changed) {
              State.transactions = Array.from(existingMap.values());
              recalculateStockBalances();
              renderTransactionHistory();
            }
          }, err => {
            console.warn('[Firestore] Realtime subscription warning:', err);
          });

        // Flush any initial queued items
        flushOfflineQueue();
      } catch (err) {
        console.warn('[Firebase] Init exception:', err);
        updateOnlineStatus(false, 'Local Mode');
      }
    }

    async function flushOfflineQueue() {
      if (!State.db || !navigator.onLine || State.offlineQueue.length === 0) return;

      const queueCopy = [...State.offlineQueue];
      const remaining = [];

      for (const tx of queueCopy) {
        try {
          // 1. Write transaction to firestore
          await State.db.collection('thela_stock_transactions').doc(tx.id).set({
            id: tx.id,
            date: tx.date,
            item: tx.item,
            quantity: tx.quantity,
            type: tx.type,
            timestamp: tx.timestamp,
            source: tx.source || 'mobile_pwa',
            excel_sr: tx.excel_sr || null,
            synced_to_excel: tx.synced_to_excel || false,
            notes: tx.notes || ''
          });

          // 2. Mark in-memory tx as synced
          const found = State.transactions.find(t => t.id === tx.id);
          if (found) found.status = 'synced';

        } catch (err) {
          console.warn('[Firestore] Push failed for tx:', tx.id, err);
          remaining.push(tx);
        }
      }

      // 3. Update summary doc
      try {
        const summaryData = {};
        ITEMS.forEach(it => {
          summaryData[it] = State.stockBalances[it] || {};
        });
        await State.db.collection('thela_stock_summary').doc('live_summary').set({
          balances: summaryData,
          lastUpdated: new Date().toISOString()
        });
      } catch (e) {
        console.warn('[Firestore] Summary update warning:', e);
      }

      State.offlineQueue = remaining;
      saveToLocalStorage();
      renderTransactionHistory();
      if (remaining.length === 0 && queueCopy.length > 0) {
        showToast('All transactions synced to cloud', 'success');
      }
    }

    /* ==========================================================================
       9. SHEETJS IN-BROWSER EXCEL EXPORT ENGINE
       ========================================================================== */
    function initSheetJsExportEngine() {
      if (UI['btn-export-excel']) {
        UI['btn-export-excel'].addEventListener('click', exportToExcel);
      }
    }

    function exportToExcel() {
      if (typeof XLSX === 'undefined') {
        alert('SheetJS engine is still loading or unavailable offline.');
        return;
      }

      try {
        const wb = XLSX.utils.book_new();

        // Sheet 1: C. Stock Summary
        const summaryHeader = [["SR", "Item Name", "Op. Stock", "Stock In", "Stock Out", "Current Stock"]];
        const summaryRows = ITEMS.map((item, idx) => {
          const b = State.stockBalances[item] || { opStock: 0, stockIn: 0, stockOut: 0, currentStock: 0 };
          return [idx + 1, item, b.opStock, b.stockIn, b.stockOut, b.currentStock];
        });
        const wsSummary = XLSX.utils.aoa_to_sheet([...summaryHeader, ...summaryRows]);
        XLSX.utils.book_append_sheet(wb, wsSummary, "C. Stock Summary");

        // Sheet 2: Transactions (Ascending by SR/Date)
        const sortedTx = [...State.transactions].sort((a, b) => {
          const srA = a.sr || 0;
          const srB = b.sr || 0;
          if (srA !== 0 && srB !== 0) return srA - srB;
          return (a.date || '').localeCompare(b.date || '');
        });

        const txHeader = [["SR", "Date", "Item Name", "Quantity", "Type"]];
        const txRows = sortedTx.map((tx, idx) => [
          tx.sr || (idx + 1),
          tx.date,
          tx.item,
          tx.quantity,
          tx.type
        ]);
        const wsTx = XLSX.utils.aoa_to_sheet([...txHeader, ...txRows]);
        XLSX.utils.book_append_sheet(wb, wsTx, "Transactions");

        // Download
        const todayStr = new Date().toISOString().slice(0, 10);
        const fileName = `Thela_Stock_Export_${todayStr}.xlsx`;
        XLSX.writeFile(wb, fileName);

        if (haptics) haptics.playCelebration();
        showToast(`Exported ${fileName}`, 'success');
      } catch (err) {
        console.error('[SheetJS] Export error:', err);
        showToast('Export failed: ' + err.message, 'warning');
      }
    }

    /* ==========================================================================
       10. SERVICE WORKER REGISTRATION
       ========================================================================== */
    function registerAppServiceWorker() {
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => {
              console.log('[PWA] Service Worker registered:', reg.scope);
            })
            .catch(err => {
              console.warn('[PWA] Service Worker registration failed:', err);
            });
        });
      }
    }

    /* ==========================================================================
       11. UI TOAST SYSTEM
       ========================================================================== */
    function showToast(message, type = 'info') {
      if (!UI['toast-container']) return;
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icon = (type === 'success') ? '✅' : (type === 'warning' ? '⚠️' : 'ℹ️');
      toast.innerHTML = `<span>${icon}</span><span>${message}</span>`;
      UI['toast-container'].appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.add('show');
      });

      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => {
          if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 300);
      }, 3200);
    }

    /* ==========================================================================
       12. DEFENSIVE COMPONENT BOOTLOADER ISOLATION
       ========================================================================== */
    function bootApplication() {
      const modules = [
        { name: 'DOM Hygiene & Element Binding', fn: bindDomElements, critical: true },
        { name: 'Web Audio Micro-Haptics', fn: initWebAudioHaptics, critical: false },
        { name: 'State Management Store', fn: initStateStore, critical: true },
        { name: 'Touch Input Controls', fn: initTouchControls, critical: true },
        { name: 'Offline LocalStorage Queue', fn: initOfflineQueueManager, critical: true },
        { name: 'SheetJS Excel Export Engine', fn: initSheetJsExportEngine, critical: false },
        { name: 'Firebase Firestore Realtime Sync', fn: initFirebaseSyncEngine, critical: false },
        { name: 'Service Worker Registration', fn: registerAppServiceWorker, critical: false }
      ];

      modules.forEach(m => {
        try {
          m.fn();
        } catch (err) {
          console.warn(`[Bootloader Warning] Module "${m.name}" non-fatal failure:`, err);
        }
      });
    }

    window.addEventListener('DOMContentLoaded', bootApplication);
  </script>
