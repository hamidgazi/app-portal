<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>🔗 Antigravity Links Hub & Omnichannel Quick Share</title>
  <meta name="description" content="Centralized links manager and 1-tap quick sharing engine for GitHub repositories, live web apps, cloud services, and developer tools.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">

  <style>
    :root {
      --bg-base: #070a12;
      --bg-surface: #0e1424;
      --bg-card: #131b30;
      --bg-card-hover: #19243f;
      --border: #1e293b;
      --border-accent: rgba(56, 189, 248, 0.3);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.25);
      --purple: #a855f7;
      --amber: #f59e0b;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px 80px 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    button, a, input {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.97);
      transition: transform 0.08s var(--spring);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.6px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 40%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      max-width: 680px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* Top Controls Bar */
    .controls-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .search-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 240px;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px 12px 40px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      opacity: 0.5;
      pointer-events: none;
    }

    .btn-add-link {
      background: var(--accent);
      color: #050811;
      font-weight: 700;
      font-size: 13.5px;
      padding: 11px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 10px var(--accent-glow);
      min-height: 44px;
      white-space: nowrap;
    }

    .btn-add-link:hover {
      filter: brightness(1.1);
    }

    .btn-portal-back {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-weight: 600;
      font-size: 13px;
      padding: 11px 16px;
      border-radius: 10px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      white-space: nowrap;
    }

    .btn-portal-back:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Category Filter Pills */
    .pills-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }

    .pills-container::-webkit-scrollbar {
      display: none;
    }

    .filter-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      scroll-snap-align: start;
      min-height: 38px;
    }

    .filter-pill:hover {
      background: var(--bg-card-hover);
      color: #fff;
    }

    .filter-pill.active {
      background: var(--accent);
      color: #050811;
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-dim);
      padding: 0 6px;
      margin-bottom: 16px;
    }

    /* Links Grid */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .link-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
      position: relative;
    }

    .link-card:hover {
      transform: translateY(-2px);
      border-color: #334155;
      background: var(--bg-card);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .card-icon {
      font-size: 24px;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-info {
      flex: 1;
      min-width: 0;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 2px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      white-space: nowrap;
    }

    .card-domain {
      font-size: 11.5px;
      color: var(--text-dim);
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 14px;
      flex: 1;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 14px;
    }

    .card-tag {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-dim);
    }

    /* Actions Toolbar */
    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: auto;
    }

    .btn-act {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      min-height: 36px;
      text-decoration: none;
    }

    .btn-act:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-color: #334155;
    }

    .btn-act.btn-act-open {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.3);
      margin-left: auto;
    }

    .btn-act.btn-act-open:hover {
      background: var(--accent);
      color: #050811;
    }

    .btn-act.btn-act-wa {
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.08);
    }

    .btn-act.btn-act-wa:hover {
      background: rgba(16, 185, 129, 0.2);
    }

    /* Modals */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .modal-backdrop.open {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      max-width: 480px;
      width: 100%;
      padding: 24px;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 13.5px;
      outline: none;
      transition: border 0.15s;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--accent);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #050811;
      font-weight: 700;
      font-size: 14px;
      padding: 12px;
      border-radius: 9px;
      border: none;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    /* QR Frame inside Modal */
    .qr-modal-frame {
      width: 220px;
      height: 220px;
      background: #fff;
      border-radius: 14px;
      margin: 16px auto;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-modal-frame img, .qr-modal-frame svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--green);
      color: #000;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s var(--spring);
      z-index: 300;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 640px) {
      body {
        padding: 16px 12px 70px 12px;
      }
      h1 {
        font-size: 24px;
      }
      .links-grid {
        grid-template-columns: 1fr;
      }
      .card-actions {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <header>
      <div class="header-badge">🔗 Omnichannel Link Hub</div>
      <h1>Links & Quick Share</h1>
      <p class="subtitle">Access, launch, and share all your GitHub repositories, live web apps, cloud services, and developer tools in 1 tap.</p>
    </header>

    <!-- Controls Panel -->
    <div class="controls-panel">
      <div class="search-row">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="search" class="search-input" id="search-input" placeholder="Search links, repositories, tools... (Ctrl+K)" autocomplete="off">
        </div>
        <button class="btn-add-link" id="btn-open-add">➕ Add Link</button>
        <a class="btn-portal-back" href="index.html">🚀 Open App Portal</a>
      </div>

      <div class="pills-container" id="category-pills">
        <button class="filter-pill active" data-category="ALL">All Links</button>
        <button class="filter-pill" data-category="🚀 Live Web Apps">🚀 Live Apps</button>
        <button class="filter-pill" data-category="🐙 GitHub Repositories">🐙 GitHub</button>
        <button class="filter-pill" data-category="☁️ Cloud & Google Services">☁️ Cloud</button>
        <button class="filter-pill" data-category="🛠️ Web Arsenal & Tools">🛠️ Web Arsenal</button>
        <button class="filter-pill" data-category="⭐ Custom Saved Links">⭐ Custom</button>
      </div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <span id="stats-count">Showing 0 links</span>
      <span>Tap 📋 Copy, 💬 WhatsApp, or 📱 QR to share</span>
    </div>

    <!-- Links Grid -->
    <div class="links-grid" id="links-grid">
      <!-- Populated dynamically -->
    </div>

  </div>

  <!-- QR Code Modal -->
  <div class="modal-backdrop" id="qr-modal">
    <div class="modal-content" style="text-align: center;">
      <button class="modal-close" id="qr-close">✕</button>
      <div style="font-size: 28px; margin-bottom: 6px;">📱</div>
      <h3 style="font-size: 17px; font-weight: 700; margin-bottom: 4px;" id="qr-modal-title">Share Link</h3>
      <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 12px; word-break: break-all;" id="qr-modal-url"></div>
      
      <div class="qr-modal-frame" id="qr-frame">
        <!-- QR image -->
      </div>

      <div style="display: flex; gap: 8px; justify-content: center; margin-top: 14px;">
        <button class="btn-act" id="btn-qr-copy">📋 Copy Link</button>
        <button class="btn-act btn-act-wa" id="btn-qr-wa">💬 WhatsApp</button>
      </div>
    </div>
  </div>

  <!-- Add Link Modal -->
  <div class="modal-backdrop" id="add-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">➕ Add Custom Link</h3>
        <button class="modal-close" id="add-close">✕</button>
      </div>

      <form id="add-link-form">
        <div class="form-group">
          <label class="form-label" for="inp-title">Link Title *</label>
          <input class="form-input" id="inp-title" placeholder="e.g. My Important Sheet / Tool" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="inp-url">Web URL (https://...) *</label>
          <input class="form-input" id="inp-url" type="url" placeholder="https://example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="inp-cat">Category</label>
          <select class="form-select" id="inp-cat">
            <option value="⭐ Custom Saved Links">⭐ Custom Saved Links</option>
            <option value="🚀 Live Web Apps">🚀 Live Web Apps</option>
            <option value="🐙 GitHub Repositories">🐙 GitHub Repositories</option>
            <option value="☁️ Cloud & Google Services">☁️ Cloud & Google Services</option>
            <option value="🛠️ Web Arsenal & Tools">🛠️ Web Arsenal & Tools</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="inp-desc">Short Description</label>
          <input class="form-input" id="inp-desc" placeholder="What is this link for?">
        </div>

        <div class="form-group">
          <label class="form-label" for="inp-tags">Tags (comma separated)</label>
          <input class="form-input" id="inp-tags" placeholder="e.g. docs, finance, work">
        </div>

        <button type="submit" class="btn-submit">Save Link</button>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast">Copied to clipboard!</div>

  <!-- Synchronous Catalog Script -->
  <script src="links_catalog.js"></script>

  <script>
    // State
    const Catalog = {
      baseLinks: (window.LINKS_CATALOG && window.LINKS_CATALOG.links) ? window.LINKS_CATALOG.links : [],
      customLinks: JSON.parse(localStorage.getItem("antigravity_custom_links") || "[]"),
      activeCategory: "ALL",
      searchQuery: "",
      activeQRLink: null
    };

    function getAllLinks() {
      return [...Catalog.baseLinks, ...Catalog.customLinks];
    }

    const DOM = {
      searchInput: document.getElementById("search-input"),
      categoryPills: document.getElementById("category-pills"),
      statsCount: document.getElementById("stats-count"),
      linksGrid: document.getElementById("links-grid"),
      btnAdd: document.getElementById("btn-open-add"),
      addModal: document.getElementById("add-modal"),
      addClose: document.getElementById("add-close"),
      addForm: document.getElementById("add-link-form"),
      qrModal: document.getElementById("qr-modal"),
      qrClose: document.getElementById("qr-close"),
      qrTitle: document.getElementById("qr-modal-title"),
      qrUrl: document.getElementById("qr-modal-url"),
      qrFrame: document.getElementById("qr-frame"),
      btnQrCopy: document.getElementById("btn-qr-copy"),
      btnQrWa: document.getElementById("btn-qr-wa"),
      toast: document.getElementById("toast")
    };

    function showToast(msg) {
      if (!DOM.toast) return;
      DOM.toast.textContent = msg;
      DOM.toast.classList.add("show");
      setTimeout(() => DOM.toast.classList.remove("show"), 2500);
    }

    function renderLinks() {
      const all = getAllLinks();
      const query = Catalog.searchQuery.toLowerCase().trim();

      const filtered = all.filter(item => {
        const matchesCategory = (Catalog.activeCategory === "ALL") || (item.category === Catalog.activeCategory);
        if (!matchesCategory) return false;
        if (!query) return true;
        const inTitle = (item.title || "").toLowerCase().includes(query);
        const inDesc = (item.description || "").toLowerCase().includes(query);
        const inUrl = (item.url || "").toLowerCase().includes(query);
        const inDomain = (item.domain || "").toLowerCase().includes(query);
        const inTags = (item.tags || []).some(t => t.toLowerCase().includes(query));
        return inTitle || inDesc || inUrl || inDomain || inTags;
      });

      if (DOM.statsCount) {
        DOM.statsCount.textContent = `Showing ${filtered.length} of ${all.length} links`;
      }

      if (filtered.length === 0) {
        DOM.linksGrid.innerHTML = `
          <div style="grid-column: 1 / -1; padding: 40px 16px; text-align: center; color: var(--text-dim);">
            🔍 No links found matching "${escapeHtml(query)}"
          </div>
        `;
        return;
      }

      DOM.linksGrid.innerHTML = filtered.map(link => {
        const domain = link.domain || extractDomain(link.url);
        return `
          <article class="link-card" data-link-id="${escapeHtml(link.id)}" data-url="${escapeHtml(link.url)}" data-title="${escapeHtml(link.title)}">
            <div class="card-head">
              <div class="card-icon">${link.icon || '🔗'}</div>
              <div class="card-info">
                <div class="card-title-row">
                  <span class="card-title" title="${escapeHtml(link.title)}">${escapeHtml(link.title)}</span>
                  <span class="card-badge">${escapeHtml(link.badge || link.category)}</span>
                </div>
                <div class="card-domain">${escapeHtml(domain)}</div>
              </div>
            </div>

            <p class="card-desc">${escapeHtml(link.description || 'Quick access link.')}</p>

            <div class="card-tags">
              ${(link.tags || []).map(t => `<span class="card-tag">#${escapeHtml(t)}</span>`).join('')}
            </div>

            <div class="card-actions">
              <button class="btn-act act-copy" title="Copy clean link">📋 Copy</button>
              <button class="btn-act btn-act-wa act-wa" title="Share via WhatsApp">💬 WhatsApp</button>
              <button class="btn-act act-qr" title="Scan QR on phone">📱 QR</button>
              <button class="btn-act act-native" title="Share via phone share sheet">📲</button>
              <a class="btn-act btn-act-open" href="${escapeHtml(link.url)}" target="_blank" rel="noopener" title="Open in new tab">↗️ Open</a>
            </div>
          </article>
        `;
      }).join('');
    }

    function extractDomain(url) {
      try {
        const u = new URL(url);
        return u.hostname;
      } catch (e) {
        return url;
      }
    }

    function copyLink(url, title) {
      navigator.clipboard.writeText(url).then(() => {
        showToast(`Copied: ${title}`);
      }).catch(() => {
        // Fallback
        const inp = document.createElement("input");
        inp.value = url;
        document.body.appendChild(inp);
        inp.select();
        document.execCommand("copy");
        document.body.removeChild(inp);
        showToast("Copied link to clipboard!");
      });
    }

    function shareWhatsApp(url, title) {
      const text = `*${title}*\n${url}`;
      const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
      window.open(waUrl, "_blank", "noopener");
    }

    function shareNative(url, title, desc) {
      if (navigator.share) {
        navigator.share({
          title: title,
          text: desc || title,
          url: url
        }).catch(() => {});
      } else {
        copyLink(url, title);
      }
    }

    function openQR(url, title) {
      Catalog.activeQRLink = { url, title };
      if (DOM.qrTitle) DOM.qrTitle.textContent = title;
      if (DOM.qrUrl) DOM.qrUrl.textContent = url;
      if (DOM.qrFrame) {
        const qrImgUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
        DOM.qrFrame.innerHTML = `<img src="${qrImgUrl}" alt="QR Code" style="width: 100%; height: 100%;">`;
      }
      if (DOM.qrModal) DOM.qrModal.classList.add("open");
    }

    function closeQR() {
      if (DOM.qrModal) DOM.qrModal.classList.remove("open");
    }

    function openAddModal() {
      if (DOM.addModal) DOM.addModal.classList.add("open");
    }

    function closeAddModal() {
      if (DOM.addModal) DOM.addModal.classList.remove("open");
      if (DOM.addForm) DOM.addForm.reset();
    }

    function saveCustomLink(e) {
      e.preventDefault();
      const title = document.getElementById("inp-title").value.trim();
      let url = document.getElementById("inp-url").value.trim();
      if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = "https://" + url;
      }
      const category = document.getElementById("inp-cat").value;
      const desc = document.getElementById("inp-desc").value.trim();
      const tagsStr = document.getElementById("inp-tags").value.trim();
      const tags = tagsStr ? tagsStr.split(",").map(t => t.trim()).filter(Boolean) : ["custom"];

      const newLink = {
        id: "custom-" + Date.now(),
        title: title,
        url: url,
        category: category,
        icon: "⭐",
        badge: "Custom",
        domain: extractDomain(url),
        description: desc || "Personal saved link.",
        tags: tags
      };

      Catalog.customLinks.unshift(newLink);
      localStorage.setItem("antigravity_custom_links", JSON.stringify(Catalog.customLinks));
      
      closeAddModal();
      showToast("Custom link saved!");
      renderLinks();
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Defensive Bootloader
    function bootLinks() {
      // 1. Search Listeners
      if (DOM.searchInput) {
        DOM.searchInput.addEventListener("input", e => {
          Catalog.searchQuery = e.target.value;
          renderLinks();
        });
      }

      // Shortcut Ctrl+K
      window.addEventListener("keydown", e => {
        if ((e.ctrlKey && e.key === "k") || (e.key === "/" && document.activeElement.tagName !== "INPUT")) {
          e.preventDefault();
          if (DOM.searchInput) DOM.searchInput.focus();
        }
      });

      // 2. Category Pills
      if (DOM.categoryPills) {
        DOM.categoryPills.addEventListener("click", e => {
          const pill = e.target.closest(".filter-pill");
          if (!pill) return;
          DOM.categoryPills.querySelectorAll(".filter-pill").forEach(p => p.classList.remove("active"));
          pill.classList.add("active");
          Catalog.activeCategory = pill.dataset.category;
          renderLinks();
        });
      }

      // 3. Delegation on Links Grid
      if (DOM.linksGrid) {
        DOM.linksGrid.addEventListener("click", e => {
          const card = e.target.closest(".link-card");
          if (!card) return;
          const url = card.dataset.url;
          const title = card.dataset.title;

          if (e.target.closest(".act-copy")) {
            e.preventDefault();
            copyLink(url, title);
          } else if (e.target.closest(".act-wa")) {
            e.preventDefault();
            shareWhatsApp(url, title);
          } else if (e.target.closest(".act-qr")) {
            e.preventDefault();
            openQR(url, title);
          } else if (e.target.closest(".act-native")) {
            e.preventDefault();
            shareNative(url, title);
          }
        });
      }

      // 4. Modals
      if (DOM.btnAdd) DOM.btnAdd.addEventListener("click", openAddModal);
      if (DOM.addClose) DOM.addClose.addEventListener("click", closeAddModal);
      if (DOM.addForm) DOM.addForm.addEventListener("submit", saveCustomLink);
      if (DOM.qrClose) DOM.qrClose.addEventListener("click", closeQR);
      if (DOM.qrModal) {
        DOM.qrModal.addEventListener("click", e => {
          if (e.target === DOM.qrModal) closeQR();
        });
      }
      if (DOM.addModal) {
        DOM.addModal.addEventListener("click", e => {
          if (e.target === DOM.addModal) closeAddModal();
        });
      }

      if (DOM.btnQrCopy) {
        DOM.btnQrCopy.addEventListener("click", () => {
          if (Catalog.activeQRLink) copyLink(Catalog.activeQRLink.url, Catalog.activeQRLink.title);
        });
      }
      if (DOM.btnQrWa) {
        DOM.btnQrWa.addEventListener("click", () => {
          if (Catalog.activeQRLink) shareWhatsApp(Catalog.activeQRLink.url, Catalog.activeQRLink.title);
        });
      }

      // 5. Initial Render
      renderLinks();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", bootLinks);
    } else {
      bootLinks();
    }
  </script>
</body>
</html>
