<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>قرآنی اخلاق و آداب • Kanzul Iman Manners Compendium</title>
  <meta name="description" content="پورے قرآنِ کریم سے اخلاق و آداب کا مکمل انسائیکلوپیڈیا ترجمہ کنز الایمان کے ساتھ">

  <style>
    :root {
      --bg-darkest: #070a12;
      --bg-card-glass: rgba(15, 23, 42, 0.75);
      --gold-primary: #fbbf24;
      --gold-border: rgba(212, 175, 55, 0.35);
      --emerald-glow: #10b981;
      --urdu-font-size: calc(1.4rem * var(--ayah-font-scale, 1.0));
      --arabic-font-size: calc(2.0rem * var(--ayah-font-scale, 1.0));
    }

    body {
      background: radial-gradient(circle at 50% 0%, #172554 0%, #070a12 70%);
      color: #f8fafc;
      font-family: var(--font-ui), sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      direction: rtl;
    }

    .manners-app-header {
      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--gold-border);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content-wrap {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-branding {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-logo-icon {
      font-size: 2.4rem;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius-full);
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-titles h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: #fbbf24;
      margin: 0 0 2px 0;
      letter-spacing: -0.01em;
    }

    .header-titles p {
      font-size: 0.84rem;
      color: #94a3b8;
      margin: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .font-control-btn {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-subtle);
      color: #f8fafc;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .font-control-btn:hover {
      border-color: var(--gold-primary);
      color: var(--gold-primary);
    }

    .portal-back-btn {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      padding: 7px 16px;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .portal-back-btn:hover {
      background: rgba(16, 185, 129, 0.3);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .manners-main-container {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px 60px;
    }

    /* Modules Filter Bar */
    .modules-nav-ribbon {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--gold-border) transparent;
    }

    .module-tab-btn {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border-subtle);
      color: #cbd5e1;
      padding: 10px 18px;
      border-radius: var(--radius-full);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      touch-action: manipulation;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .module-tab-btn:hover {
      border-color: var(--gold-primary);
      color: #fbbf24;
      background: rgba(212, 175, 55, 0.1);
    }

    .module-tab-btn.active {
      background: rgba(212, 175, 55, 0.2);
      border-color: var(--gold-primary);
      color: #fbbf24;
      font-weight: 700;
      box-shadow: 0 0 16px rgba(251, 191, 36, 0.25);
    }

    .module-tab-badge {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 7px;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
    }

    /* Search & Filter Toolbar */
    .manners-toolbar {
      background: var(--bg-card-glass);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
      min-width: 260px;
    }

    .search-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      pointer-events: none;
    }

    .manners-search-field {
      width: 100%;
      background: rgba(10, 15, 30, 0.85);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      padding: 10px 42px 10px 16px;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
      direction: rtl;
    }

    .manners-search-field:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
    }

    /* Cards Grid */
    .manners-cards-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .manner-card {
      background: var(--bg-card-glass);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .manner-card:hover {
      border-color: var(--gold-border);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45), 0 0 18px rgba(212, 175, 55, 0.12);
    }

    .manner-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-wrap: wrap;
      gap: 10px;
    }

    .manner-headline {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .manner-ref-badge {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: #fbbf24;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 700;
      font-family: var(--font-arabic), serif;
    }

    .manner-arabic-text {
      font-family: var(--font-arabic), serif;
      font-size: var(--arabic-font-size);
      line-height: 1.8;
      color: #ffffff;
      text-align: right;
      margin-bottom: 14px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    .manner-urdu-box {
      background: rgba(10, 15, 30, 0.5);
      border-right: 3px solid var(--gold-primary);
      border-radius: 4px;
      padding: 12px 18px;
      margin-bottom: 14px;
    }

    .manner-urdu-kanzuliman {
      font-family: var(--font-urdu), serif;
      font-size: var(--urdu-font-size);
      line-height: 1.85;
      color: #e2e8f0;
      text-align: right;
    }

    .manner-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .manner-en-translation {
      font-size: 0.88rem;
      color: #94a3b8;
      line-height: 1.5;
      direction: ltr;
      text-align: left;
      flex: 1;
      min-width: 260px;
    }

    .copy-manner-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .copy-manner-btn:hover {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #34d399;
    }

    /* Notification Toast */
    .copy-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #10b981;
      color: #022c22;
      padding: 10px 24px;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
      z-index: 9999;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .copy-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 768px) {
      .manners-app-header {
        padding: 12px 14px;
      }
      .header-titles h1 {
        font-size: 1.2rem;
      }
      .manner-card {
        padding: 16px;
      }
      :root {
        --urdu-font-size: calc(1.22rem * var(--ayah-font-scale, 1.0));
        --arabic-font-size: calc(1.65rem * var(--ayah-font-scale, 1.0));
      }
    }
  </style>

eflect or have some fear.'", "reference_badge": "[طٰهٰ: 44]", "reference_code": "[Taha 20:44]"}, {"surah_id": 6, "ayah_num": 108, "surah_name_ar": "اَلْاَ نْعَام", "surah_name_roman": "Al Anam", "title_ur": "دوسروں کے معبودوں کو برا نہ کہو تاکہ وہ بے سمجھے اللہ کو برا نہ کہیں", "arabic": "وَ لَا تَسُبُّوا الَّذِیْنَ یَدْعُوْنَ مِنْ دُوْنِ اللّٰهِ فَیَسُبُّوا اللّٰهَ عَدْوًا بِغَیْرِ عِلْمٍؕ-كَذٰلِكَ زَیَّنَّا لِكُلِّ اُمَّةٍ عَمَلَهُمْ۪-ثُمَّ اِلٰى رَبِّهِمْ مَّرْجِعُهُمْ فَیُنَبِّئُهُمْ بِمَا كَانُوْا یَعْمَلُوْنَ", "urdu_kanzul_iman": "اور انہیں گالی نہ دو جن کو وہ  اللہ  کے سوا پوجتے ہیں کہ وہ  اللہ  کی شان میں بے ادبی کریں گے زیادتی اور جہالت سے یونہی ہم نے ہر اُمت کی نگاہ میں اس کے عمل بھلے کردیے ہیں پھر انہیں اپنے رب کی طرف پھرنا ہے اور وہ انہیں بتادے گا جو کرتے تھے۔", "english": "Do not use offensive words against those (false deities) whom they worship other than Allah; that they (in retaliation) will insult Allah's Glory through injustice and ignorance. Likewise, in the eyes of every nation, We have made their deeds appear good, they are then to return towards their Lord, and He will inform them of what they used to do.", "reference_badge": "[اَلْاَ نْعَام: 108]", "reference_code": "[Al Anam 6:108]"}, {"surah_id": 23, "ayah_num": 3, "surah_name_ar": "اَلْمُؤْمِنُوْن", "surah_name_roman": "Al Muminun", "title_ur": "فضول، لایعنی اور بیہودہ باتوں سے منہ پھیر لو", "arabic": "وَ الَّذِیْنَ هُمْ عَنِ اللَّغْوِ مُعْرِضُوْنَ", "urdu_kanzul_iman": "اور وہ جو کسی بیہودہ بات کی طرف اِلتفات نہیں  کرتے۔", "english": "And who do not incline towards vain talk.", "reference_badge": "[اَلْمُؤْمِنُوْن: 3]", "reference_code": "[Al Muminun 23:3]"}, {"surah_id": 28, "ayah_num": 55, "surah_name_ar": "اَلْقَصَص", "surah_name_roman": "Al Qasas", "title_ur": "بیہودہ بات سن کر الجھنے کے بجائے سلامتی کہہ کر دامن بچا لو", "arabic": "وَ اِذَا سَمِعُوا اللَّغْوَ اَعْرَضُوْا عَنْهُ وَ قَالُوْا لَنَا اَعْمَالُنَا وَ لَكُمْ اَعْمَالُكُمْ٘-سَلٰمٌ عَلَیْكُمْ٘-لَا نَبْتَغِی الْجٰهِلِیْنَ", "urdu_kanzul_iman": "اور جب بیہودہ بات سنتے ہیں  اس سے تغافل کرتے ہیں  اور کہتے ہیں  ہمارے لیے ہمارے عمل اور تمہارے لیے تمہارے عمل بس تم پر سلام ہم جاہلوں  کے غرضی  نہیں ۔", "english": "And when they hear obscene talk, they turn away and say, 'For us are our deeds and for you are your deeds. Enough! Peace be upon you (i.e. an expression of disapproval); we are not interested in the ignorant.'", "reference_badge": "[اَلْقَصَص: 55]", "reference_code": "[Al Qasas 28:55]"}, {"surah_id": 4, "ayah_num": 148, "surah_name_ar": "اَلنِّسَآء", "surah_name_roman": "An Nisa", "title_ur": "برائی اور گالی گلوچ کو سرِ عام پھیلانا ناپسندیدہ ہے", "arabic": "لَا یُحِبُّ اللّٰهُ الْجَهْرَ بِالسُّوْٓءِ مِنَ الْقَوْلِ اِلَّا مَنْ ظُلِمَؕ-وَ كَانَ اللّٰهُ سَمِیْعًا عَلِیْمًا", "urdu_kanzul_iman": "اللہ  پسند نہیں کرتا بری بات کا اعلان کرنا مگر مظلوم سے اور  اللہ   سنتا جانتا ہے۔", "english": "Allah does not like the public utterance of evil talk except by the oppressed, and Allah is All-Hearing, All-Knowing.", "reference_badge": "[اَلنِّسَآء: 148]", "reference_code": "[An Nisa 4:148]"}, {"surah_id": 25, "ayah_num": 72, "surah_name_ar": "اَلْفُرْقَان", "surah_name_roman": "Al Furqan", "title_ur": "جھوٹی گواہی نہ دو اور لغو کے پاس سے باوقار گزر جاؤ", "arabic": "وَ الَّذِیْنَ لَا یَشْهَدُوْنَ الزُّوْرَ-وَ اِذَا مَرُّوْا بِاللَّغْوِ مَرُّوْا كِرَامًا", "urdu_kanzul_iman": "اور جو جھوٹی گواہی نہیں  دیتے اور جب بیہودہ پر گزرتے ہیں  اپنی عزت سنبھالے گزر جاتے ہیں ۔", "english": "And those who do not give false testimony, and when they pass by (something) immoral, they pass by protecting their honour.", "reference_badge": "[اَلْفُرْقَان: 72]", "reference_code": "[Al Furqan 25:72]"}]}, {"id": "parents", "title_ur": "حقوق و آدابِ والدین اور اہل و عیال", "title_en": "Rights & Etiquette of Parents & Kinship", "icon": "❤️", "description_ur": "ماں باپ کے ساتھ احسان، بڑھاپے میں تعظیم، اف تک نہ کہنا اور بیوی بچوں کے ساتھ خوش اخلاقی۔", "total_ayat": 7, "items": [{"surah_id": 17, "ayah_num": 23, "surah_name_ar": "بَنِیْٓ اِسْرَآءِیْل (اَلْاَسْرَاء)", "surah_name_roman": "Al Isra", "title_ur": "ماں باپ کے سامنے اف (ہوں) نہ کہو اور تعظیم سے بات کرو", "arabic": "وَ قَضٰى رَبُّكَ اَلَّا تَعْبُدُوْا اِلَّا اِیَّاهُ وَ بِالْوَالِدَیْنِ اِحْسَانًاؕ-اِمَّا یَبْلُغَنَّ عِنْدَكَ الْكِبَرَ اَحَدُهُمَا اَوْ كِلٰهُمَا فَلَا تَقُلْ لَّهُمَا اُفٍّ وَّ لَا تَنْهَرْهُمَا وَ قُلْ لَّهُمَا قَوْلًا كَرِیْمًا", "urdu_kanzul_iman": "اور تمہارے رب نے حکم فرمایا کہ اس کے سوا کسی کو نہ پوجو اور ماں  باپ کے ساتھ اچھا سلوک کرو اگر تیرے سامنے ان میں  ایک یا دونوں  بڑھاپے کو پہنچ جائیں  تو ان سے ہُوں  نہ کہنا اور انہیں  نہ جھڑکنا اور ان سے تعظیم کی بات کہنا ۔", "english": "And your Lord has commanded not to worship anyone except Him, and treat parents with goodness; if one of them or both reach old age in front of you, so, do not say (even) 'Ugh' to them and do not scold them, and speak to them words of respect.", "reference_badge": "[بَنِیْٓ اِسْرَآءِیْل (اَلْاَسْرَاء): 23]", "reference_code": "[Al Isra 17:23]"}, {"surah_id": 17, "ayah_num": 24, "surah_name_ar": "بَنِیْٓ اِسْرَآءِیْل (اَلْاَسْرَاء)", "surah_name_roman": "Al Isra", "title_ur": "والدین کے سامنے عاجزی کا بازو جھکاؤ اور ان کے حق میں رحمت کی دعا کرو", "arabic": "وَ اخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ وَ قُلْ رَّبِّ ارْحَمْهُمَا كَمَا رَبَّیٰنِیْ صَغِیْرًا", "urdu_kanzul_iman": "اور ان کے لیے عاجزی کا بازو بچھا نرم دلی سے اور عرض کر کہ اے میرے رب تو ان دونوں  پر رحم کر جیسا کہ ان دونوں  نے مجھے چھٹپن میں  پالا۔", "english": "And spread for them the arm of humbleness with a soft heart, and request humbly that 'O my Lord, have mercy on them both, just as they brought me up in my childhood.'", "reference_badge": "[بَنِیْٓ اِسْرَآءِیْل (اَلْاَسْرَاء): 24]", "reference_code": "[Al Isra 17:24]"}, {"surah_id": 31, "ayah_num": 14, "surah_name_ar": "لُقْمٰن", "surah_name_roman": "Luqman", "title_ur": "ماں کی مشقتوں کا حق پہچانو، اللہ کا شکر کرو اور والدین کا شکر گزار بنو", "arabic": "وَ وَصَّیْنَا الْاِنْسَانَ بِوَالِدَیْهِ-حَمَلَتْهُ اُمُّهٗ وَهْنًا عَلٰى وَهْنٍ وَّ فِصٰلُهٗ فِیْ عَامَیْنِ اَنِ اشْكُرْ لِیْ وَ لِوَالِدَیْكَؕ-اِلَیَّ الْمَصِیْرُٜ", "urdu_kanzul_iman": "اور ہم نے آدمی کو اس کے ماں  باپ کے بارے میں  تاکید فرمائی اُس کی ماں  نے اُسے پیٹ میں  رکھا کمزوری پر کمزوری جھیلتی ہوئی اور اس کا دودھ چھوٹنا دو برس میں  ہے یہ کہ حق مان میرا اور اپنے ماں  باپ کا آخر مجھی تک آنا ہے۔", "english": "And We emphasised upon man concerning his parents; his mother carried him in the womb, undergoing weakness upon weakness, and his suckling is up to two years, so, be thankful to Me and to your parents. In the end, return is towards only Me.", "reference_badge": "[لُقْمٰن: 14]", "reference_code": "[Luqman 31:14]"}, {"surah_id": 46, "ayah_num": 15, "surah_name_ar": "اَلْاَحْقَاف", "surah_name_roman": "Al Ahqaf", "title_ur": "والدین کے ساتھ حسنِ سلوک اور چالیس سال کی عمر میں مغفرت کی دعا", "arabic": "وَ وَصَّیْنَا الْاِنْسَانَ بِوَالِدَیْهِ اِحْسٰنًاؕ-حَمَلَتْهُ اُمُّهٗ كُرْهًا وَّ وَضَعَتْهُ كُرْهًاؕ-وَ حَمْلُهٗ وَ فِصٰلُهٗ ثَلٰثُوْنَ شَهْرًاؕ-حَتّٰى اِذَا بَلَغَ اَشُدَّهٗ وَ بَلَغَ اَرْبَعِیْنَ سَنَةً-قَالَ رَبِّ اَوْزِعْنِیْ اَنْ اَشْكُرَ نِعْمَتَكَ الَّتِیْ اَنْعَمْتَ عَلَیَّ وَ عَلٰى وَالِدَیَّ وَ اَنْ اَعْمَلَ صَالِحًا تَرْضٰىهُ وَ اَصْلِحْ لِیْ فِیْ ذُرِّیَّتِیْ اِنِّیْ تُبْتُ اِلَیْكَ وَ اِنِّیْ مِنَ الْمُسْلِمِیْنَ", "urdu_kanzul_iman": "اور ہم نے آدمی کو حکم کیاکہ اپنے ماں  باپ سے بھلائی کرے ا س کی ماں  نے اُسے پیٹ میں  رکھا تکلیف سے اور جنی اس کو تکلیف سے اور اُسے اٹھائے پھرنا اور اس کا دودھ چھڑانا تیس مہینہ میں  ہے یہاں  تک کہ جب اپنے زور کو پہنچا اور چالیس برس کا ہوا عرض کی اے میرے رب میرے دل میں  ڈال کہ میں  تیری نعمت کا شکر کروں  جو تو نے مجھ پر اور میرے ماں  باپ پر کی اور میں  وہ کام کروں  جو تجھے پسند آئے اور میرے لیے میری اولاد میں  صلاح رکھ میں  تیری طرف رجوع لایا اور میں  مسلمان ہوں ۔", "english": "And We have commanded man to be good towards his parents; his mother bore him in the womb with hardship, and delivered him with hardship; and carrying him and weaning him is for thirty months, until he reached maturity and became forty years of age. He said, 'O my Lord, inspire me to be thankful for the favours You bestowed upon me and upon my parents, and I may perform the deeds which please You. Keep piety in my children for my sake, I have returned  towards You and I am a Muslim.'", "reference_badge": "[اَلْاَحْقَاف: 15]", "reference_code": "[Al Ahqaf 46:15]"}, {"surah_id": 4, "ayah_num": 19, "surah_name_ar": "اَلنِّسَآء", "surah_name_roman": "An Nisa", "title_ur": "بیویوں کے ساتھ اچھے اور پسندیدہ طریقے سے زندگی بسر کرو", "arabic": "یٰاَیُّهَا  الَّذِیْنَ  اٰمَنُوْا  لَا  یَحِلُّ  لَكُمْ  اَنْ  تَرِثُوا  النِّسَآءَ  كَرْهًاؕ-وَ  لَا  تَعْضُلُوْهُنَّ  لِتَذْهَبُوْا  بِبَعْضِ   مَا  اٰتَیْتُمُوْهُنَّ  اِلَّا  اَنْ  یَّاْتِیْنَ  بِفَاحِشَةٍ  مُّبَیِّنَةٍ-وَ  عَاشِرُوْهُنَّ  بِالْمَعْرُوْفِ-فَاِنْ  كَرِهْتُمُوْهُنَّ  فَعَسٰى  اَنْ  تَكْرَهُوْا  شَیْــٴًـا  وَّ  یَجْعَلَ  اللّٰهُ  فِیْهِ  خَیْرًا  كَثِیْرًا", "urdu_kanzul_iman": "اے ایمان والو تمہیں حلال نہیں کہ عورتوں کے وارث بن جاؤ زبردستی اور عورتوں کو روکو نہیں اس نیت سے کہ جو مہر ان کو دیا تھا اس میں سے کچھ لے لو مگر اس صورت میں کہ صریح بے حیا ئی کا کام کریں اور ان سے اچھا برتاؤ کرو پھر اگر وہ تمہیں پسند نہ آئیں تو قریب ہے کہ کوئی چیز تمہیں ناپسند ہو اور  اللہ  اس میں بہت بھلائی رکھے۔", "english": "O believers! It is not lawful for you to become the heirs of women by force, and do not detain women with the intention of taking away a part of the dowry you gave them, unless they commit blatant shamelessness. And deal with them kindly, if you do not then like them, it is therefore likely that you dislike a thing in which Allah has placed much good.", "reference_badge": "[اَلنِّسَآء: 19]", "reference_code": "[An Nisa 4:19]"}, {"surah_id": 4, "ayah_num": 36, "surah_name_ar": "اَلنِّسَآء", "surah_name_roman": "An Nisa", "title_ur": "توحید کے بعد ماں باپ اور قریبی رشتہ داروں سے حسنِ سلوک کا حکم", "arabic": "وَ اعْبُدُوا اللّٰهَ وَ لَا تُشْرِكُوْا بِهٖ شَیْــٴًـا وَّ بِالْوَالِدَیْنِ اِحْسَانًا وَّ بِذِی الْقُرْبٰى وَ الْیَتٰمٰى وَ الْمَسٰكِیْنِ وَ الْجَارِ ذِی الْقُرْبٰى وَ الْجَارِ الْجُنُبِ وَ الصَّاحِبِ بِالْجَنْبِ وَ ابْنِ السَّبِیْلِ-وَ مَا مَلَكَتْ اَیْمَانُكُمْؕ-اِنَّ اللّٰهَ لَا یُحِبُّ مَنْ كَانَ مُخْتَالًا فَخُوْرَا", "urdu_kanzul_iman": "اور  اللہ  کی بندگی کرو اور اس کا شریک کسی کو نہ ٹھہراؤ اور ماں باپ سے بھلائی کرو اور رشتہ داروں اور یتیموں اور محتاجوں اور پاس کے ہمسائے اور دور کے ہمسائے اور کروٹ کے ساتھی اور راہ گیر اور اپنی باندی غلام سے بے شک  اللہ  کو خوش نہیں آتا کوئی اترانے والا بڑائی مارنے والا۔", "english": "And worship Allah and associate no one with Him; and be good to parents, and relatives, and orphans, and the needy, and the near neighbour and the distant neighbour, and the close companion and the traveller, and your male and female slaves. Indeed, Allah does not like the arrogant, the boastful.", "reference_badge": "[اَلنِّسَآء: 36]", "reference_code": "[An Nisa 4:36]"}, {"surah_id": 2, "ayah_num": 233, "surah_name_ar": "اَلْبَقَرَة", "surah_name_roman": "Al Baqarah", "title_ur": "اولاد کے معاملے میں ماں یا باپ میں سے کسی کو ناحق نقصان نہ پہنچایا جائے", "arabic": "وَ الْوَالِدٰتُ یُرْضِعْنَ اَوْلَادَهُنَّ حَوْلَیْنِ كَامِلَیْنِ لِمَنْ اَرَادَ اَنْ یُّتِمَّ الرَّضَاعَةَؕ-وَ عَلَى الْمَوْلُوْدِ لَهٗ رِزْقُهُنَّ وَ كِسْوَتُهُنَّ بِالْمَعْرُوْفِؕ-لَا تُكَلَّفُ نَفْسٌ اِلَّا وُسْعَهَا-لَا تُضَآرَّ وَالِدَةٌ بِوَلَدِهَا وَ لَا مَوْلُوْدٌ لَّهٗ بِوَلَدِهٖ-وَ عَلَى الْوَارِثِ مِثْلُ ذٰلِكَ-فَاِنْ اَرَادَا فِصَالًا عَنْ تَرَاضٍ مِّنْهُمَا وَ تَشَاوُرٍ فَلَا جُنَاحَ عَلَیْهِمَاؕ-وَ اِنْ اَرَدْتُّمْ اَنْ تَسْتَرْضِعُوْا اَوْلَادَكُمْ فَلَا جُنَاحَ عَلَیْكُمْ اِذَا سَلَّمْتُمْ مَّا اٰتَیْتُمْ بِالْمَعْرُوْفِؕ-وَ اتَّقُوا اللّٰهَ وَ اعْلَمُوْا اَنَّ اللّٰهَ بِمَا تَعْمَلُوْنَ بَصِیْرٌ", "urdu_kanzul_iman": "اور مائیں دودھ پلائیں اپنے بچوں کو پورے دو برس اس کے لئے جو دودھ کی مدت پوری کرنی چاہے اور جس کا بچہ ہے اس پر عورتوں کا کھانا پہننا ہے حسب دستور کسی جان پر بوجھ نہ رکھا جائے گا مگر اس کے مقدور بھر ماں کو ضرر نہ دیا جائے اس کے بچہ سے اور نہ اولاد والے کو اس کی اولاد سے یا ماں ضرر نہ دے اپنے بچہ کو اور نہ اولاد والا اپنی اولاد کو اور جو باپ کا قائم مقام ہے اس پر بھی ایسا ہی واجب ہے پھر اگر ماں باپ دونوں آپس کی رضا اور مشورے سے دودھ چھڑانا چاہیں تو ان پر گناہ نہیں اور اگر تم چاہو کہ دائیوں سے اپنے بچوں کو دودھ پلواؤ تو بھی تم پر مضائقہ نہیں جب کہ جو دینا ٹھہرا تھا بھلائی کے ساتھ انہیں ادا کردو، اور  اللہ  سے ڈرتے رہو اور جان رکھو کہ  اللہ  تمہارے کام دیکھ رہا ہے۔", "english": "And mothers should suckle their babies for two complete years; for those who wish to complete the period of suckling. And to whom the child belongs (i.e. the father) must provide food and clothing for the (breastfeeding) women in accordance with the custom. No soul shall be burdened except with what it can bear. A mother should not be harmed because of her child, nor the father be harmed because of his child, and the same is incumbent upon the guardian in place of the father. If both the mother and the father then desire to wean the child by mutual consent and consultation, so there is no sin upon them. And if you wish to have your children suckled by foster mothers, there is no sin upon you too; provided you pay them what is agreed, with kindness. And keep fearing Allah, and know that Allah is observing your deeds.", "reference_badge": "[اَلْبَقَرَة: 233]", "reference_code": "[Al Baqarah 2:233]"}]}, {"id": "humility", "title_ur": "عجز و انکسار اور چال ڈھال کے آداب", "title_en": "Humility, Walking & Demeanor", "icon": "🚶", "description_ur": "زمین پر عاجزی سے چلنا، گردن اکڑانے اور تکبر سے بچنا، اور جاہلوں کی بیہودگی پر سلام کہنا۔", "total_ayat": 6, "items": [{"surah_id": 17, "ayah_num": 37, "surah_name_ar": "بَنِیْٓ اِسْرَآءِیْل (اَلْاَسْرَاء)", "surah_name_roman": "Al Isra", "title_ur": "زمین پر اکڑ کر مت چلو، نہ تم زمین پھاڑ سکتے ہو نہ پہاڑوں کو چھو سکتے ہو", "arabic": "وَ لَا تَمْشِ فِی الْاَرْضِ مَرَحًا-اِنَّكَ لَنْ تَخْرِقَ الْاَرْضَ وَ لَنْ تَبْلُغَ الْجِبَالَ طُوْلًا", "urdu_kanzul_iman": "اور زمین میں  اتراتا نہ چل بیشک تو ہر گز زمین نہ چیر ڈالے گا اور ہرگز بلندی میں  پہاڑوں  کو نہ پہنچے گا۔", "english": "And do not walk arrogantly on the earth; undoubtedly, you will indeed never tear the earth apart and will never reach the mountains in height.", "reference_badge": "[بَنِیْٓ اِسْرَآءِیْل (اَلْاَسْرَاء): 37]", "reference_code": "[Al Isra 17:37]"}, {"surah_id": 31, "ayah_num": 18, "surah_name_ar": "لُقْمٰن", "surah_name_roman": "Luqman", "title_ur": "لوگوں سے تکبر سے رخسار مت پھیرو اور اِترا کر نہ چلو", "arabic": "وَ لَا تُصَعِّرْ خَدَّكَ لِلنَّاسِ وَ لَا تَمْشِ فِی الْاَرْضِ مَرَحًاؕ-اِنَّ اللّٰهَ لَا یُحِبُّ كُلَّ مُخْتَالٍ فَخُوْرٍ", "urdu_kanzul_iman": "اور کسی سے بات کرنے میں  اپنا رخسارہ کج نہ کر اور زمین میں  اِتراتا نہ چل بیشک الله کو نہیں  بھاتا کوئی اِتراتا فخر کرتا۔", "english": "'And do not make your cheek crooked (in arrogance) whilst talking to anyone, nor boastfully walk upon the earth; indeed, Allah does not like any boastful, arrogant person.'", "reference_badge": "[لُقْمٰن: 18]", "reference_code": "[Luqman 31:18]"}, {"surah_id": 25, "ayah_num": 63, "surah_name_ar": "اَلْفُرْقَان", "surah_name_roman": "Al Furqan", "title_ur": "رحمن کے بندے زمین پر عاجزی سے چلتے ہیں اور جاہلوں کو سلام کہتے ہیں", "arabic": "وَ عِبَادُ الرَّحْمٰنِ الَّذِیْنَ یَمْشُوْنَ عَلَى الْاَرْضِ هَوْنًا وَّ اِذَا خَاطَبَهُمُ الْجٰهِلُوْنَ قَالُوْا سَلٰمًا", "urdu_kanzul_iman": "اور رحمٰن کے وہ بندے کہ زمین پر آہستہ چلتے ہیں  اور جب جاہل ان سے بات کرتے ہیں  تو کہتے ہیں  بس سلام۔", "english": "Those bondsmen of the Most Gracious who walk upon the earth humbly, and when the ignorant address them (rudely), their only response is, 'Salaam' (i.e. a greeting of parting).", "reference_badge": "[اَلْفُرْقَان: 63]", "reference_code": "[Al Furqan 25:63]"}, {"surah_id": 7, "ayah_num": 146, "surah_name_ar": "اَلْاَعْرَاف", "surah_name_roman": "Al Araf", "title_ur": "ناحق تکبر کرنے والے اللہ کی نشانیوں سے محروم کر دیے جاتے ہیں", "arabic": "سَاَصْرِفُ عَنْ اٰیٰتِیَ الَّذِیْنَ یَتَكَبَّرُوْنَ فِی الْاَرْضِ بِغَیْرِ الْحَقِّؕ-وَ اِنْ یَّرَوْا كُلَّ اٰیَةٍ لَّا یُؤْمِنُوْا بِهَا-وَ اِنْ یَّرَوْا سَبِیْلَ الرُّشْدِ لَا یَتَّخِذُوْهُ سَبِیْلًا-وَ اِنْ یَّرَوْا سَبِیْلَ الْغَیِّ یَتَّخِذُوْهُ سَبِیْلًاؕ-ذٰلِكَ بِاَنَّهُمْ كَذَّبُوْا بِاٰیٰتِنَا وَ كَانُوْا عَنْهَا غٰفِلِیْنَ", "urdu_kanzul_iman": "اور میں اپنی آیتوں سے انہیں پھیردوں گا جو زمین میں ناحق اپنی بڑائی چاہتے ہیں اور اگر سب نشانیاں دیکھیں ان پر ایمان نہ لائیں اور اگر ہدایت کی راہ دیکھیں اس میں چلنا پسند نہ کریں اور گمراہی کا راستہ نظر پڑے تو اس میں چلنے کو موجود ہوجائیں یہ اس لیے کہ انہوں نے ہماری آیتیں جھٹلائیں اور ان سے بے خبر بنے۔", "english": "'And I shall turn those people away from My verses who undeservedly wish greatness for themselves on the earth; and (even) if they see all the signs, they would (still) not believe them. And if they see the path of guidance, they would not like to walk on it; and if they see the way of error, they would therefore present themselves to walk on it; this is because they belied Our verses and became unmindful of them.", "reference_badge": "[اَلْاَعْرَاف: 146]", "reference_code": "[Al Araf 7:146]"}, {"surah_id": 16, "ayah_num": 23, "surah_name_ar": "اَلنَّحْل", "surah_name_roman": "An Nahl", "title_ur": "اللہ غرور اور تکبر کرنے والوں کو ہرگز پسند نہیں فرماتا", "arabic": "لَا جَرَمَ اَنَّ اللّٰهَ یَعْلَمُ مَا یُسِرُّوْنَ وَ مَا یُعْلِنُوْنَؕ-اِنَّهٗ لَا یُحِبُّ الْمُسْتَكْبِرِیْنَ", "urdu_kanzul_iman": "فی الحقیقت اللہ جانتا ہے جو چھپاتے اور جو ظاہر کرتے ہیں  بیشک وہ مغروروں  کو پسند نہیں  فرماتا۔", "english": "In fact, Allah knows what they (try to) hide and what they disclose. Indeed, He does not like the arrogant.", "reference_badge": "[اَلنَّحْل: 23]", "reference_code": "[An Nahl 16:23]"}, {"surah_id": 28, "ayah_num": 83, "surah_name_ar": "اَلْقَصَص", "surah_name_roman": "Al Qasas", "title_ur": "آخرت کا گھر ان کے لیے ہے جو زمین میں تکبر اور فساد نہیں چاہتے", "arabic": "تِلْكَ الدَّارُ الْاٰخِرَةُ نَجْعَلُهَا لِلَّذِیْنَ لَا یُرِیْدُوْنَ عُلُوًّا فِی الْاَرْضِ وَ لَا فَسَادًاؕ-وَ الْعَاقِبَةُ لِلْمُتَّقِیْنَ", "urdu_kanzul_iman": "یہ آخرت کا گھر ہم اُن کے لیے کرتے ہیں  جو زمین میں  تکبر نہیں  چاہتے اور نہ فساد اور عاقبت پرہیزگاروں  ہی کی ہے۔", "english": "This abode of the Hereafter, We make it for those who do not seek arrogance in the land nor disorder; and the Hereafter is (good) only for the pious.", "reference_badge": "[اَلْقَصَص: 83]", "reference_code": "[Al Qasas 28:83]"}]}, {"id": "privacy", "title_ur": "معاشرتی آداب، پردہ داری اور راز داری", "title_en": "Social Etiquette, Privacy & Respect", "icon": "🚪", "description_ur": "گھروں میں اجازت لے کر داخل ہونا، سلام کرنا، تجسس، بدگمانی، تمسخر اور عیب جوئی سے پرہیز۔", "total_ayat": 9, "items": [{"surah_id": 24, "ayah_num": 27, "surah_name_ar": "اَلنُّوْر", "surah_name_roman": "An Noor", "title_ur": "دوسروں کے گھروں میں اجازت لیے بغیر اور سلام کیے بغیر داخل نہ ہو", "arabic": "یٰاَیُّهَا الَّذِیْنَ اٰمَنُوْا لَا تَدْخُلُوْا بُیُوْتًا غَیْرَ بُیُوْتِكُمْ حَتّٰى تَسْتَاْنِسُوْا وَ تُسَلِّمُوْا عَلٰى اَهْلِهَاؕ-ذٰلِكُمْ خَیْرٌ لَّكُمْ لَعَلَّكُمْ تَذَكَّرُوْنَ", "urdu_kanzul_iman": "اے ایمان والو اپنے گھروں  کے سوا اور گھروں  میں  نہ جاؤ جب تک اجازت نہ لے لو اور ان کے ساکِنوں  پر سلام نہ کرلو یہ تمہارے لیے بہتر ہے کہ تم دھیان کرو۔", "english": "O believers! Do not enter the houses except your own, until you have obtained permission and have conveyed Salaam to its residents; this is better for you, that you may ponder.", "reference_badge": "[اَلنُّوْر: 27]", "reference_code": "[An Noor 24:27]"}, {"surah_id": 24, "ayah_num": 28, "surah_name_ar": "اَلنُّوْر", "surah_name_roman": "An Noor", "title_ur": "اگر گھر میں کوئی نہ ہو یا واپس جانے کو کہا جائے تو خوش دلی سے لوٹ جاؤ", "arabic": "فَاِنْ لَّمْ تَجِدُوْا فِیْهَا اَحَدًا فَلَا تَدْخُلُوْهَا حَتّٰى یُؤْذَنَ لَكُمْ-وَ اِنْ قِیْلَ لَكُمُ ارْجِعُوْا فَارْجِعُوْا هُوَ اَزْكٰى لَكُمْؕ-وَ اللّٰهُ بِمَا تَعْمَلُوْنَ عَلِیْمٌ", "urdu_kanzul_iman": "پھر اگر ان میں  کسی کو نہ پاؤ جب بھی بے ما لکوں  کی اجازت کے ان میں  نہ جاؤ اور اگر تم سے کہا جائے واپس جاؤ تو واپس ہو یہ تمہارے لیے بہت ستھرا ہے   اللہ  تمہارے کاموں  کو جانتا ہے۔", "english": "And if you do not find anyone in them, even then do not enter it without the permission of (their) owners. And if you are told, 'Go back,' then go back; this is much purer for you. Allah knows your deeds.", "reference_badge": "[اَلنُّوْر: 28]", "reference_code": "[An Noor 24:28]"}, {"surah_id": 4, "ayah_num": 86, "surah_name_ar": "اَلنِّسَآء", "surah_name_roman": "An Nisa", "title_ur": "سلام کا جواب اس سے بہتر الفاظ میں یا کم از کم ویسا ہی دو", "arabic": "وَ اِذَا حُیِّیْتُمْ بِتَحِیَّةٍ فَحَیُّوْا بِاَحْسَنَ مِنْهَا اَوْ رُدُّوْهَاؕ-اِنَّ اللّٰهَ كَانَ عَلٰى كُلِّ شَیْءٍ حَسِیْبًاٜ", "urdu_kanzul_iman": "اور جب تمہیں کوئی کسی لفظ سے سلام کرے تو تم اس سے بہتر لفظ جواب میں کہو یا وہی کہہ دو بے شک  اللہ  ہر چیز پر حساب لینے والا ہے۔", "english": "And when someone greets you with some words (of greeting), respond therefore with words better than that or return the same; indeed, Allah is going to take account of everything.", "reference_badge": "[اَلنِّسَآء: 86]", "reference_code": "[An Nisa 4:86]"}, {"surah_id": 49, "ayah_num": 11, "surah_name_ar": "اَلْحُجُرٰت", "surah_name_roman": "Al Hujurat", "title_ur": "ایک دوسرے کا مذاق مت اڑاؤ اور برے القاب سے نہ پکارو", "arabic": "یٰاَیُّهَا الَّذِیْنَ اٰمَنُوْا لَا یَسْخَرْ قَوْمٌ مِّنْ قَوْمٍ عَسٰى اَنْ یَّكُوْنُوْا خَیْرًا مِّنْهُمْ وَ لَا نِسَآءٌ مِّنْ نِّسَآءٍ عَسٰى اَنْ یَّكُنَّ خَیْرًا مِّنْهُنَّ-وَ لَا تَلْمِزُوْا اَنْفُسَكُمْ وَ لَا تَنَابَزُوْا بِالْاَلْقَابِؕ-بِئْسَ الِاسْمُ الْفُسُوْقُ بَعْدَ الْاِیْمَانِ-وَ مَنْ لَّمْ یَتُبْ فَاُولٰٓىٕكَ هُمُ الظّٰلِمُوْنَ", "urdu_kanzul_iman": "اے ایمان والو نہ مرد مردوں  سے ہنسیں  عجب نہیں  کہ وہ ان ہنسنے والوں  سے بہتر ہوں  اور نہ عورتیں  عورتوں  سے دُور نہیں  کہ وہ ان ہنسنے والیوں  سے بہتر ہوں  اور آپس میں  طعنہ نہ کرو اور ایک دوسرے کے بُرے نام نہ رکھو کیا ہی بُرا نام ہے مسلمان ہوکر فاسق کہلانا اور جو توبہ نہ کریں  تو وہی ظالم ہیں ۔", "english": "O believers! Men must not ridicule other men, it is likely that the ridiculed are better than the mockers; nor must the women ridicule other women, it is likely that the ridiculed women may be better than the mockers; and do not taunt one another, nor give evil nicknames. What a bad name it is to be called an evildoer after being a Muslim. And whoever does not repent, it is they who are the unjust.", "reference_badge": "[اَلْحُجُرٰت: 11]", "reference_code": "[Al Hujurat 49:11]"}, {"surah_id": 49, "ayah_num": 12, "surah_name_ar": "اَلْحُجُرٰت", "surah_name_roman": "Al Hujurat", "title_ur": "بدگمانی سے بچو، جاسوسی مت کرو اور پیٹھ پیچھے غیبت نہ کرو", "arabic": "یٰاَیُّهَا الَّذِیْنَ اٰمَنُوا اجْتَنِبُوْا كَثِیْرًا مِّنَ الظَّنِّ٘-اِنَّ بَعْضَ الظَّنِّ اِثْمٌ وَّ لَا تَجَسَّسُوْا وَ لَا یَغْتَبْ بَّعْضُكُمْ بَعْضًاؕ-اَیُحِبُّ اَحَدُكُمْ اَنْ یَّاْكُلَ لَحْمَ اَخِیْهِ مَیْتًا فَكَرِهْتُمُوْهُؕ-وَ اتَّقُوا اللّٰهَؕ-اِنَّ اللّٰهَ تَوَّابٌ رَّحِیْمٌ", "urdu_kanzul_iman": "اے ایمان والو بہت گمانوں  سے بچو بیشک کوئی گمان گناہ ہوجاتا ہے اور عیب نہ ڈھونڈھو اور ایک دوسرے کی غیبت نہ کرو کیا تم میں  کوئی پسند رکھے گا کہ اپنے مرے بھائی کا گوشت کھائے تو یہ تمہیں  گوارا نہ ہوگا اور  اللہ  سے ڈرو بیشک  اللہ  بہت توبہ قبول کرنے والا مہربان ہے۔", "english": "O believers! Avoid much suspicions; indeed, some suspicions become sin. And do not search for (hidden) faults, do not backbite one another; would any one amongst you like to eat the flesh of his dead brother? So, you will not tolerate this. And fear Allah; indeed, Allah is the Great Acceptor of repentance, Ever Merciful.", "reference_badge": "[اَلْحُجُرٰت: 12]", "reference_code": "[Al Hujurat 49:12]"}, {"surah_id": 24, "ayah_num": 30, "surah_name_ar": "اَلنُّوْر", "surah_name_roman": "An Noor", "title_ur": "مرد اپنی نگاہیں نیچی رکھیں اور اپنی شرمگاہوں کی حفاظت کریں", "arabic": "قُلْ لِّلْمُؤْمِنِیْنَ یَغُضُّوْا مِنْ اَبْصَارِهِمْ وَ یَحْفَظُوْا فُرُوْجَهُمْؕ-ذٰلِكَ اَزْكٰى لَهُمْؕ-اِنَّ اللّٰهَ خَبِیْرٌ بِمَا یَصْنَعُوْنَ", "urdu_kanzul_iman": "مسلمان مردوں  کو حکم دو اپنی نگاہیں  کچھ نیچی رکھیں  اور اپنی شرمگاہوں  کی حفاظت کریں  یہ ان کے لیے بہت ستھرا ہے بیشک   اللہ  کو ان کے کاموں  کی خبر ہے۔", "english": "Command the Muslim men to keep their gaze somewhat low and protect their private parts; this is much purer for them. Indeed, Allah is Aware of their actions.", "reference_badge": "[اَلنُّوْر: 30]", "reference_code": "[An Noor 24:30]"}, {"surah_id": 24, "ayah_num": 31, "surah_name_ar": "اَلنُّوْر", "surah_name_roman": "An Noor", "title_ur": "عورتیں اپنی نگاہیں نیچی رکھیں اور اپنی زینت کو ظاہر نہ کریں", "arabic": "وَ قُلْ لِّلْمُؤْمِنٰتِ یَغْضُضْنَ مِنْ اَبْصَارِهِنَّ وَ یَحْفَظْنَ فُرُوْجَهُنَّ وَ لَا یُبْدِیْنَ زِیْنَتَهُنَّ اِلَّا مَا ظَهَرَ مِنْهَا وَ لْیَضْرِبْنَ بِخُمُرِهِنَّ عَلٰى جُیُوْبِهِنَّ۪-وَ لَا یُبْدِیْنَ زِیْنَتَهُنَّ اِلَّا لِبُعُوْلَتِهِنَّ اَوْ اٰبَآىٕهِنَّ اَوْ اٰبَآءِ بُعُوْلَتِهِنَّ اَوْ اَبْنَآىٕهِنَّ اَوْ اَبْنَآءِ بُعُوْلَتِهِنَّ اَوْ اِخْوَانِهِنَّ اَوْ بَنِیْ اِخْوَانِهِنَّ اَوْ بَنِیْ اَخَوٰتِهِنَّ اَوْ نِسَآىٕهِنَّ اَوْ مَا مَلَكَتْ اَیْمَانُهُنَّ اَوِ التّٰبِعِیْنَ غَیْرِ اُولِی الْاِرْبَةِ مِنَ الرِّجَالِ اَوِ الطِّفْلِ الَّذِیْنَ لَمْ یَظْهَرُوْا عَلٰى عَوْرٰتِ النِّسَآءِ۪-وَ لَا یَضْرِبْنَ بِاَرْجُلِهِنَّ لِیُعْلَمَ مَا یُخْفِیْنَ مِنْ زِیْنَتِهِنَّؕ-وَ تُوْبُوْا اِلَى اللّٰهِ جَمِیْعًا اَیُّهَ الْمُؤْمِنُوْنَ لَعَلَّكُمْ تُفْلِحُوْنَ", "urdu_kanzul_iman": "اور مسلمان عورتوں  کو حکم دو اپنی نگاہیں  کچھ نیچی رکھیں  اور اپنی پارسائی کی حفاظت کریں  اور اپنا بناؤ نہ دکھائیں  مگر جتنا خود ہی ظاہر ہے اور دوپٹے اپنے گریبانوں  پر ڈالے رہیں  اور اپنا سنگار ظاہر نہ کریں  مگر اپنے شوہروں  پر یا اپنے باپ یا شوہروں  کے باپ یا اپنے بیٹے یا شوہروں  کے بیٹے یا اپنے بھائی یا اپنے بھتیجے یا اپنے بھانجے یا اپنے دین کی عورتیں  یا اپنی کنیزیں  جو اپنے ہاتھ کی مِلک ہوں  یا نوکر بشرطیکہ شہوت والے مرد نہ ہوں  یا وہ بچے جنہیں  عورتوں  کی شرم کی چیزوں  کی خبر نہیں  اور زمین پر پاؤں  زور سے نہ رکھیں  کہ جانا جائے ان کا چھپا ہوا سنگار اور   اللہ  کی طرف توبہ کرو اے مسلمانو سب کے سب اس امید پر کہ تم فلاح پاؤ۔", "english": "And command the Muslim women to keep their gaze slightly low, and to protect their chastity, and not to reveal their adornment except what is apparent itself, and to keep the head-covering wrapped over their bosoms, and not to reveal their adornment except to their own husbands, or fathers, or husbands' fathers; or their own sons or their husbands' sons; or their brothers or their brothers' sons or sisters' sons; or women of their own religion, or the handmaids whom they possess, or servants provided that they are not men of carnal desire, or such children who do not yet know women's private aspects of intimacy, and not to stamp their feet forcibly on the ground in order that their hidden adornment be known. And O Muslims! All of you turn towards Allah in repentance, in the hope of attaining success.", "reference_badge": "[اَلنُّوْر: 31]", "reference_code": "[An Noor 24:31]"}, {"surah_id": 24, "ayah_num": 58, "surah_name_ar": "اَلنُّوْر", "surah_name_roman": "An Noor", "title_ur": "خلوت کے تین اوقات میں گھر کے ملازمین اور بچوں کا اجازت لے کر آنا", "arabic": "یٰاَیُّهَا الَّذِیْنَ اٰمَنُوْا لِیَسْتَاْذِنْكُمُ الَّذِیْنَ مَلَكَتْ اَیْمَانُكُمْ وَ الَّذِیْنَ لَمْ یَبْلُغُوا الْحُلُمَ مِنْكُمْ ثَلٰثَ مَرّٰتٍؕ-مِنْ قَبْلِ صَلٰوةِ الْفَجْرِ وَ حِیْنَ تَضَعُوْنَ ثِیَابَكُمْ مِّنَ الظَّهِیْرَةِ وَ مِنْ بَعْدِ صَلٰوةِ الْعِشَآءِ۫ؕ-ثَلٰثُ عَوْرٰتٍ لَّكُمْؕ-لَیْسَ عَلَیْكُمْ وَ لَا عَلَیْهِمْ جُنَاحٌ بَعْدَهُنَّؕ-طَوّٰفُوْنَ عَلَیْكُمْ بَعْضُكُمْ عَلٰى بَعْضٍؕ-كَذٰلِكَ یُبَیِّنُ اللّٰهُ لَكُمُ الْاٰیٰتِؕ-وَ اللّٰهُ عَلِیْمٌ حَكِیْمٌ", "urdu_kanzul_iman": "اے ایمان والو چاہیے کہ تم سے اِذن لیں  تمہارے ہاتھ کے مال غلام اور وہ جو تم میں  ابھی جوانی کو نہ پہنچے تین وقت نمازِ صبح سے پہلے اور جب تم اپنے کپڑے اُتار رکھتے ہو دوپہر کو اور نمازِ عشاء کے بعد یہ تین وقت تمہاری شرم کے ہیں  ان تین کے بعد کچھ گناہ نہیں  تم پر نہ ان پر آمدورفت رکھتے ہیں  تمہارے یہاں  ایک دوسرے کے پاس   اللہ  یونہی بیان کرتا ہے تمہارے لیے آیتیں ، اور   اللہ  علم و حکمت والا ہے۔", "english": "O believers! The slaves you possess and those (boys) amongst you who have not attained adulthood must seek your permission on three occasions; before the morning prayer, and when you remove your garments at noon, and after the night prayer; these three times are of privacy for you. Other than these three times, it is no sin for you or for them; they come and go about (to assist) one another. And this is how Allah explains (His) verses for you, and Allah is All-Knowing, Ever Wise.", "reference_badge": "[اَلنُّوْر: 58]", "reference_code": "[An Noor 24:58]"}, {"surah_id": 58, "ayah_num": 11, "surah_name_ar": "اَلْمُجَادَلَة", "surah_name_roman": "Al Mujadilah", "title_ur": "مجلس میں دوسروں کے لیے کشادگی پیدا کرو، اللہ تمہیں وسعت عطا فرمائے گا", "arabic": "یٰاَیُّهَا الَّذِیْنَ اٰمَنُوْا اِذَا قِیْلَ لَكُمْ تَفَسَّحُوْا فِی الْمَجٰلِسِ فَافْسَحُوْا یَفْسَحِ اللّٰهُ لَكُمْ-وَ اِذَا قِیْلَ انْشُزُوْا فَانْشُزُوْا یَرْفَعِ اللّٰهُ الَّذِیْنَ اٰمَنُوْا مِنْكُمْ-وَ الَّذِیْنَ اُوْتُوا الْعِلْمَ دَرَجٰتٍؕ-وَ اللّٰهُ بِمَا تَعْمَلُوْنَ خَبِیْرٌ", "urdu_kanzul_iman": "اے ایمان والو جب تم سے کہا جائے مجلسوں  میں  جگہ دو تو جگہ دو اللہ تمہیں  جگہ دے گا اور جب کہا جائے اٹھ کھڑے ہو تو اُٹھ کھڑے ہو اللہ تمہارے ایمان والوں  کے اور ان کے جن کو علم دیا گیا درجے بلند فرمائے گا اور اللہ کو تمہارے کاموں  کی خبر ہے۔", "english": "O believers! When you are told to make space (for your brothers to sit) in gatherings, so make space; Allah will give you space (by giving you respect and prosperity); and when it is said, 'Stand up (for Salah or battle),' then stand up; Allah will raise the ranks of the (excellent) believers amongst you and those who have been given knowledge. And Allah is Aware of your deeds.", "reference_badge": "[اَلْمُجَادَلَة: 11]", "reference_code": "[Al Mujadilah 58:11]"}]}, {"id": "forgiveness", "title_ur": "ضبطِ نفس، عفو، درگزر اور حسنِ سلوک", "title_en": "Self-Restraint, Forgiveness & Kindness", "icon": "🕊️", "description_ur": "غصہ پینا، لوگوں کی غلطیوں کو معاف کرنا، برائی کا بدلہ اچھائی سے دینا اور انتقام سے درگزر۔", "total_ayat": 7, "items": [{"surah_id": 3, "ayah_num": 134, "surah_name_ar": "اٰلِ عِمْرَان", "surah_name_roman": "Al Imran", "title_ur": "غصہ ضبط کرنے والے اور لوگوں کو معاف کرنے والے اللہ کے محبوب ہیں", "arabic": "الَّذِیْنَ  یُنْفِقُوْنَ  فِی  السَّرَّآءِ  وَ  الضَّرَّآءِ  وَ  الْـكٰظِمِیْنَ  الْغَیْظَ  وَ  الْعَافِیْنَ  عَنِ  النَّاسِؕ-وَ  اللّٰهُ  یُحِبُّ  الْمُحْسِنِیْنَ", "urdu_kanzul_iman": "وہ جو  اللہ  کی راہ میں خرچ کرتے ہیں خوشی میں اور رنج میں اور غصہ پینے والے اور لوگوں سے درگزر کرنے والے اور نیک لوگ  اللہ  کے محبوب ہیں۔", "english": "(They are) those who spend in the Path of Allah in prosperity and adversity, and who restrain anger and forgive people. And the righteous people are the beloveds of Allah.", "reference_badge": "[اٰلِ عِمْرَان: 134]", "reference_code": "[Al Imran 3:134]"}, {"surah_id": 41, "ayah_num": 34, "surah_name_ar": "حٰمٓ اَلسَّجْدَۃ (فُصِّلَت)", "surah_name_roman": "Fussilat", "title_ur": "برائی کو بہترین اچھائی سے ٹالو تاکہ بدترین دشمن جگری دوست بن جائے", "arabic": "وَ لَا تَسْتَوِی الْحَسَنَةُ وَ لَا السَّیِّئَةُؕ-اِدْفَعْ بِالَّتِیْ هِیَ اَحْسَنُ فَاِذَا الَّذِیْ بَیْنَكَ وَ بَیْنَهٗ عَدَاوَةٌ كَاَنَّهٗ وَلِیٌّ حَمِیْمٌ", "urdu_kanzul_iman": "اور نیکی اور بدی برابر نہ ہوجائیں  گی اے سننے والے برائی کو بھلائی سے ٹال جبھی وہ کہ تجھ میں  اور اس میں  دشمنی تھی ایسا ہوجائے گا جیسا کہ گہرا دوست۔", "english": "And the good deed and the evil deed will never be equal. O listener! Repel evil with goodness, thereupon the one between whom and you there was enmity will become like a close friend (at that time).", "reference_badge": "[حٰمٓ اَلسَّجْدَۃ (فُصِّلَت): 34]", "reference_code": "[Fussilat 41:34]"}, {"surah_id": 24, "ayah_num": 22, "surah_name_ar": "اَلنُّوْر", "surah_name_roman": "An Noor", "title_ur": "معاف کرو اور درگزر کرو، کیا تم نہیں چاہتے کہ اللہ تمہاری بخشش فرمائے؟", "arabic": "وَ لَا یَاْتَلِ اُولُوا الْفَضْلِ مِنْكُمْ وَ السَّعَةِ اَنْ یُّؤْتُوْا اُولِی الْقُرْبٰى وَ الْمَسٰكِیْنَ وَ الْمُهٰجِرِیْنَ فِیْ سَبِیْلِ اللّٰهِ -وَ لْیَعْفُوْا وَ لْیَصْفَحُوْاؕ-اَلَا تُحِبُّوْنَ اَنْ یَّغْفِرَ اللّٰهُ لَكُمْؕ-وَ اللّٰهُ غَفُوْرٌ رَّحِیْمٌ", "urdu_kanzul_iman": "اور قسم نہ کھائیں  وہ جو تم میں  فضیلت والے اور گنجائش والے ہیں  قرابت والوں  اور مسکینوں  اور   اللہ  کی راہ میں  ہجرت کرنے والوں  کو دینے کی اور چاہیے کہ معاف کریں  اور دَرگزریں ، کیا تم اسے دوست نہیں  رکھتے کہ   اللہ  تمہاری بخشش کرے اور   اللہ  بخشنے والا مہربان ہے۔", "english": "And those amongst you who possess excellence and have capacity should not take oath (in not) giving to the relatives, and the needy, and the emigrants in the path of Allah. And they should forgive and overlook, do you not like that Allah may forgive you? And Allah is Most Forgiving, Ever Merciful.", "reference_badge": "[اَلنُّوْر: 22]", "reference_code": "[An Noor 24:22]"}, {"surah_id": 42, "ayah_num": 40, "surah_name_ar": "اَلشُّوْرٰی", "surah_name_roman": "Ash Shura", "title_ur": "جو معاف کرے اور صلح کی راہ نکالے اس کا اجر اللہ کے ذمہ ہے", "arabic": "وَ جَزٰٓؤُا سَیِّئَةٍ سَیِّئَةٌ مِّثْلُهَا-فَمَنْ عَفَا وَ اَصْلَحَ فَاَجْرُهٗ عَلَى اللّٰهِؕ-اِنَّهٗ لَا یُحِبُّ الظّٰلِمِیْنَ", "urdu_kanzul_iman": "اور بُرائی کا بدلہ اُسی کی برابر برائی ہے تو جس نے معاف کیا اور کام سنوارا تو اس کا اجر  اللہ  پر ہے بے شک وہ دوست نہیں  رکھتا ظالموں  کو۔", "english": "The retribution for an evil act is an evil equal to exactly that; so whosoever forgave and made amends, his reward is therefore upon (the responsibility of the Generosity of) Allah. Indeed, He does not befriend the unjust.", "reference_badge": "[اَلشُّوْرٰی: 40]", "reference_code": "[Ash Shura 42:40]"}, {"surah_id": 42, "ayah_num": 43, "surah_name_ar": "اَلشُّوْرٰی", "surah_name_roman": "Ash Shura", "title_ur": "صبر کرنا اور قصور معاف کر دینا بہت بڑی ہمت اور اولوالعزمی کا کام ہے", "arabic": "وَ لَمَنْ صَبَرَ وَ غَفَرَ اِنَّ ذٰلِكَ لَمِنْ عَزْمِ الْاُمُوْرِ", "urdu_kanzul_iman": "اور بے شک جس نے صبر کیااور بخش دیاتو یہ ضرور ہمت کے کام ہیں ۔", "english": "And indeed, whosoever observed patience and forgave, so these are indeed acts of great courage.", "reference_badge": "[اَلشُّوْرٰی: 43]", "reference_code": "[Ash Shura 42:43]"}, {"surah_id": 7, "ayah_num": 199, "surah_name_ar": "اَلْاَعْرَاف", "surah_name_roman": "Al Araf", "title_ur": "درگزر کو اپنا شیوہ بناؤ، نیکی کا حکم دو اور نادانوں سے درگزر کرو", "arabic": "خُذِ الْعَفْوَ وَ اْمُرْ بِالْعُرْفِ وَ اَعْرِضْ عَنِ الْجٰهِلِیْنَ", "urdu_kanzul_iman": "اے محبوب معاف کرنا اختیار کرو اور بھلائی کا حکم دو اور جاہلوں سے منہ پھیرلو ۔", "english": "And O Beloved; adopt forgiveness, and command good, and turn away from the ignorant.", "reference_badge": "[اَلْاَعْرَاف: 199]", "reference_code": "[Al Araf 7:199]"}, {"surah_id": 16, "ayah_num": 126, "surah_name_ar": "اَلنَّحْل", "surah_name_roman": "An Nahl", "title_ur": "بدلہ برابر کا ہو سکتا ہے مگر صبر کر لینا صبر کرنے والوں کے لیے سب سے بہتر ہے", "arabic": "وَ اِنْ عَاقَبْتُمْ فَعَاقِبُوْا بِمِثْلِ مَا عُوْقِبْتُمْ بِهٖؕ-وَ لَىٕنْ صَبَرْتُمْ لَهُوَ خَیْرٌ لِّلصّٰبِرِیْنَ", "urdu_kanzul_iman": "اور اگر تم سزا دو تو ویسی ہی سزا دو جیسی تمہیں  تکلیف پہنچائی تھی اور اگر تم صبر کرو تو بیشک صبر والوں  کوصبر سب سے اچھا۔", "english": "And if you punish, punish therefore similar to how you were afflicted. And if you exercise patience, patience is therefore indeed best for those who are patient.", "reference_badge": "[اَلنَّحْل: 126]", "reference_code": "[An Nahl 16:126]"}]}, {"id": "justice", "title_ur": "عدل، انصاف، امانت اور سچی گواہی", "title_en": "Justice, Trusts & Honest Testimony", "icon": "⚖️", "description_ur": "اپنے اور والدین کے خلاف بھی سچی گواہی دینا، دشمن کے ساتھ بھی انصاف کرنا اور امانتیں ادا کرنا۔", "total_ayat": 7, "items": [{"surah_id": 4, "ayah_num": 135, "surah_name_ar": "اَلنِّسَآء", "surah_name_roman": "An Nisa", "title_ur": "انصاف پر مضبوطی سے قائم رہو چاہے گواہی اپنے یا والدین کے خلاف ہی کیوں نہ ہو", "arabic": "یٰاَیُّهَا الَّذِیْنَ اٰمَنُوْا كُوْنُوْا قَوّٰمِیْنَ بِالْقِسْطِ شُهَدَآءَ لِلّٰهِ وَ لَوْ عَلٰى اَنْفُسِكُمْ اَوِ الْوَالِدَیْنِ وَ الْاَقْرَبِیْنَ-اِنْ یَّكُنْ غَنِیًّا اَوْ فَقِیْرًا فَاللّٰهُ اَوْلٰى بِهِمَا- فَلَا تَتَّبِعُوا الْهَوٰى اَنْ تَعْدِلُوْا-وَ اِنْ تَلْوٗا اَوْ تُعْرِضُوْا فَاِنَّ اللّٰهَ كَانَ بِمَا تَعْمَلُوْنَ خَبِیْرًا", "urdu_kanzul_iman": "اے ایمان والو انصاف پر خوب قائم ہوجاؤ  اللہ  کے لیے گواہی دیتے چاہے اس میں تمہارا اپنا نقصان ہو یا ماں باپ کا یا رشتہ داروں کا جس پر گواہی دو وہ غنی ہو یا فقیر ہو بہرحال  اللہ  کو اس کا سب سے زیادہ اختیار ہے تو خواہش کے پیچھے نہ جاؤ کہ حق سے الگ پڑواور اگر تم ہیر پھیر کرو یا منہ پھیرو تو  اللہ  کو تمہارے کاموں کی خبر ہے۔", "english": "O believers! Become firm in standing for justice (whilst) giving testimony for the sake of Allah, even if there is loss in it for yourselves, or for (your) parents, or for (your) relatives; whether the one you testify against is rich or poor; nevertheless, Allah has greater right over it. Do not therefore follow your wishes lest you separate from the truth (i.e. justice), and if you distort (testimony) or turn away (from giving it), so Allah is Aware of your actions.", "reference_badge": "[اَلنِّسَآء: 135]", "reference_code": "[An Nisa 4:135]"}, {"surah_id": 5, "ayah_num": 8, "surah_name_ar": "اَلْمَـآئِدَة", "surah_name_roman": "Al Maidah", "title_ur": "کسی قوم کی دشمنی بھی تمہیں انصاف چھوڑنے پر مجبور نہ کرے، عدل تقویٰ کے قریب ہے", "arabic": "یٰاَیُّهَا الَّذِیْنَ اٰمَنُوْا كُوْنُوْا قَوّٰمِیْنَ لِلّٰهِ شُهَدَآءَ بِالْقِسْطِ٘-وَ لَا یَجْرِمَنَّكُمْ شَنَاٰنُ قَوْمٍ عَلٰى اَلَّا تَعْدِلُوْاؕ-اِعْدِلُوْا- هُوَ اَقْرَبُ لِلتَّقْوٰى٘-وَ اتَّقُوا اللّٰهَؕ-اِنَّ اللّٰهَ خَبِیْرٌ بِمَا تَعْمَلُوْنَ", "urdu_kanzul_iman": "اے ایمان والو  اللہ  کے حکم پر خوب قائم ہوجاؤ انصاف کے ساتھ گواہی دیتے اور تم کو کسی قوم کی عداوت اس پر نہ اُبھارے کہ انصاف نہ کرو، انصاف کرو، وہ پرہیزگاری سے زیادہ قریب ہے اور اللہ  سے ڈرو، بیشک  اللہ  کو تمہارے کامو ں کی خبر ہے۔", "english": "O believers! Be intensely steadfast in the command of Allah, while giving testimony with justice, and do not let the enmity of any nation provoke you not to do justice, be just; that is closer to piety. And fear Allah; indeed, Allah is Aware of your actions.", "reference_badge": "[اَلْمَـآئِدَة: 8]", "reference_code": "[Al Maidah 5:8]"}, {"surah_id": 4, "ayah_num": 58, "surah_name_ar": "اَلنِّسَآء", "surah_name_roman": "An Nisa", "title_ur": "امانتیں ان کے حقداروں کے سپرد کرو اور جب فیصلہ کرو تو عدل کے ساتھ کرو", "arabic": "اِنَّ اللّٰهَ یَاْمُرُكُمْ اَنْ تُؤَدُّوا الْاَمٰنٰتِ اِلٰى اَهْلِهَا-وَ اِذَا حَكَمْتُمْ بَیْنَ النَّاسِ اَنْ تَحْكُمُوْا بِالْعَدْلِؕ-اِنَّ اللّٰهَ نِعِمَّا یَعِظُكُمْ بِهٖؕ-اِنَّ اللّٰهَ كَانَ سَمِیْعًا بَصِیْرًا", "urdu_kanzul_iman": "بے شک  اللہ   تمہیں حکم دیتا ہے کہ امانتیں جن کی ہیں انھیں سپرد کرو اور یہ کہ جب تم لوگوں میں فیصلہ کرو تو انصاف کے ساتھ فیصلہ کروبے شک  اللہ   تمہیں کیا ہی خوب نصیحت فرماتا ہے بے شک  اللہ  سنتا دیکھتا ہے ۔", "english": "Indeed, Allah commands you to hand over whatever you hold in trust to their owners, and this; that whenever you judge between people, so judge with justice. Undoubtedly, what excellent advice Allah gives you. Indeed, Allah is All-Hearing, All-Seeing.", "reference_badge": "[اَلنِّسَآء: 58]", "reference_code": "[An Nisa 4:58]"}, {"surah_id": 16, "ayah_num": 90, "surah_name_ar": "اَلنَّحْل", "surah_name_roman": "An Nahl", "title_ur": "اللہ عدل، احسان اور رشتے داروں کی مدد کا حکم دیتا ہے اور بے حیائی و ظلم سے روکتا ہے", "arabic": "اِنَّ اللّٰهَ یَاْمُرُ بِالْعَدْلِ وَ الْاِحْسَانِ وَ اِیْتَآئِ ذِی الْقُرْبٰى وَ یَنْهٰى عَنِ الْفَحْشَآءِ وَ الْمُنْكَرِ وَ الْبَغْیِ-یَعِظُكُمْ لَعَلَّكُمْ تَذَكَّرُوْنَ", "urdu_kanzul_iman": "بیشک اللہ حکم فرماتا ہے انصاف اور نیکی اور رشتہ داروں  کے دینے کا اور منع فرماتا ہے بے حیائی اور بری بات اور سرکشی سے تمہیں  نصیحت فرماتا ہے کہ تم دھیان کرو۔", "english": "Indeed, Allah gives the commands of justice and kindness, and of giving to relatives, and forbids from obscenity, and evil and rebellion. He advises you that you should pay heed.", "reference_badge": "[اَلنَّحْل: 90]", "reference_code": "[An Nahl 16:90]"}, {"surah_id": 2, "ayah_num": 283, "surah_name_ar": "اَلْبَقَرَة", "surah_name_roman": "Al Baqarah", "title_ur": "سچی گواہی ہرگز نہ چھپاؤ، گواہی چھپانے والے کا دل گنہگار ہے", "arabic": "وَ اِنْ كُنْتُمْ عَلٰى سَفَرٍ وَّ لَمْ تَجِدُوْا كَاتِبًا فَرِهٰنٌ مَّقْبُوْضَةٌؕ-فَاِنْ اَمِنَ بَعْضُكُمْ بَعْضًا فَلْیُؤَدِّ الَّذِی اؤْتُمِنَ اَمَانَتَهٗ وَ لْیَتَّقِ اللّٰهَ رَبَّهٗؕ-وَ لَا تَكْتُمُوا الشَّهَادَةَؕ-وَ مَنْ یَّكْتُمْهَا فَاِنَّهٗ اٰثِمٌ قَلْبُهٗؕ-وَ اللّٰهُ بِمَا تَعْمَلُوْنَ عَلِیْمٌ", "urdu_kanzul_iman": "اور اگر تم سفر میں ہواور لکھنے والا نہ پاؤ تو گِرَو ہو قبضہ میں دیا ہوا اور اگر تم میں ایک کو دوسرے پر اطمینان ہو تو وہ جسے اس نے امین سمجھا تھا اپنی امانت ادا کرے اور  اللہ  سے ڈرے جو اس کا رب ہے اور گواہی نہ چھپاؤ اور جو گواہی چھپائے گا تو اندر سے اس کا دل گنہگار ہے اور  اللہ  تمہارے کاموں کو جانتا ہے۔", "english": "And if you are on a journey and cannot find a scribe, a guarantee must therefore be pledged (to the creditor). And if one of you trusts the other, the one who is entrusted must therefore discharge his trust to him (i.e. to the creditor) and fear Allah Who is his Lord, and do not hide testimony. And whoever hides testimony, his heart is therefore sinful from within; and Allah knows your actions.", "reference_badge": "[اَلْبَقَرَة: 283]", "reference_code": "[Al Baqarah 2:283]"}, {"surah_id": 22, "ayah_num": 30, "surah_name_ar": "اَلْحَجّ", "surah_name_roman": "Al Hajj", "title_ur": "جھوٹی بات اور بے بنیاد الزام تراشی سے سختی سے بچو", "arabic": "ذٰلِكَ-وَ مَنْ یُّعَظِّمْ حُرُمٰتِ اللّٰهِ فَهُوَ خَیْرٌ لَّهٗ عِنْدَ رَبِّهٖؕ-وَ اُحِلَّتْ لَكُمُ الْاَنْعَامُ اِلَّا مَا یُتْلٰى عَلَیْكُمْ فَاجْتَنِبُوا الرِّجْسَ مِنَ الْاَوْثَانِ وَ اجْتَنِبُوْا قَوْلَ الزُّوْرِ", "urdu_kanzul_iman": "بات یہ ہے اور جو   اللہ  کی حرمتوں  کی تعظیم کرے تو وہ اس کے لئے اس کے رب کے یہاں  بھلا ہے اور تمہارے لیے حلال کیے گئے بے زبان چوپائے سوا اُن کے جن کی ممانعت تم پر پڑھی جاتی ہے تو دور ہو بتوں  کی گندگی سے اور بچو جھوٹی بات سے۔", "english": "It is (the order of Allah), and whosoever reveres the sacred things of Allah; so, that is good for him before his Lord. And the mute animals are made lawful to you except those whose prohibition is recited to you; therefore, stay far away from the filth of idols, and avoid false speech.", "reference_badge": "[اَلْحَجّ: 30]", "reference_code": "[Al Hajj 22:30]"}, {"surah_id": 6, "ayah_num": 152, "surah_name_ar": "اَلْاَ نْعَام", "surah_name_roman": "Al Anam", "title_ur": "جب بھی بات کہو تو عدل اور سچائی کی کہو چاہے معاملہ قرابت دار کا ہی ہو", "arabic": "وَ لَا تَقْرَبُوْا مَالَ الْیَتِیْمِ اِلَّا بِالَّتِیْ هِیَ اَحْسَنُ حَتّٰى یَبْلُغَ اَشُدَّهٗ-وَ اَوْفُوا الْكَیْلَ وَ الْمِیْزَانَ بِالْقِسْطِ-لَا نُكَلِّفُ نَفْسًا اِلَّا وُسْعَهَا-وَ اِذَا قُلْتُمْ فَاعْدِلُوْا وَ لَوْ كَانَ ذَا قُرْبٰى-وَ بِعَهْدِ اللّٰهِ اَوْفُوْاؕ-ذٰلِكُمْ وَصّٰىكُمْ بِهٖ لَعَلَّكُمْ تَذَكَّرُوْنَ", "urdu_kanzul_iman": "اور یتیم کے مال کے پاس نہ جاؤ مگر بہت اچھے طریقے سے جب تک وہ اپنی جوانی کو پہنچے اور ناپ اور تول انصاف کے ساتھ پوری کرو ہم کسی جان پر بوجھ نہیں ڈالتے مگر اس کے مقدور بھر اور جب بات کہو تو انصاف کی کہو اگرچہ تمہارے رشتہ دار کا معاملہ ہو اور  اللہ  ہی کا عہد پورا کرو یہ تمہیں تاکید فرمائی کہ کہیں تم نصیحت مانو۔", "english": "'And do not approach the wealth of orphans except in the best manner, until he reaches maturity; and measure and weigh in full, with justice. We do not burden any soul except according to its capacity, and when you speak; so, speak justly, although it may be a matter concerning your own relative. And fulfil your covenant with Allah; (He has) emphasised this to you, that somehow you accept advice.'", "reference_badge": "[اَلْاَ نْعَام: 152]", "reference_code": "[Al Anam 6:152]"}]}, {"id": "financial", "title_ur": "مالی معاملات، دیانت اور ناپ تول", "title_en": "Financial Integrity & Contracts", "icon": "💰", "description_ur": "عہد پورا کرنا، ناپ تول میں کمی نہ کرنا، باطل طریقے سے مال نہ کھانا اور اعتدال سے خرچ کرنا۔", "total_ayat": 8, "items": [{"surah_id": 17, "ayah_num": 34, "surah_name_ar": "بَنِیْٓ اِسْرَآءِیْل (اَلْاَسْرَاء)", "surah_name_roman": "Al Isra", "title_ur": "عہد کو ضرور پورا کرو، بیشک قیامت کے دن عہد و پیمان کی بازپرس ہوگی", "arabic": "وَ لَا تَقْرَبُوْا مَالَ الْیَتِیْمِ اِلَّا بِالَّتِیْ هِیَ اَحْسَنُ حَتّٰى یَبْلُغَ اَشُدَّه۪ٗ-وَ اَوْفُوْا بِالْعَهْدِ-اِنَّ الْعَهْدَ كَانَ مَسْـٴُـوْلًا", "urdu_kanzul_iman": "اور یتیم کے مال کے پاس نہ جاؤ مگر اس راہ سے جو سب سے بھلی ہے یہاں  تک کہ وہ اپنی جوانی کو پہنچے اور عہد پورا کرو بیشک عہد سے سوال ہونا ہے۔", "english": "And do not even approach the wealth of the orphan except in the best way, until he reaches the age of maturity. And fulfil (your) promise; indeed, (every) promise will be asked about (on the Day of Judgement).", "reference_badge": "[بَنِیْٓ اِسْرَآءِیْل (اَلْاَسْرَاء): 34]", "reference_code": "[Al Isra 17:34]"}, {"surah_id": 17, "ayah_num": 35, "surah_name_ar": "بَنِیْٓ اِسْرَآءِیْل (اَلْاَسْرَاء)", "surah_name_roman": "Al Isra", "title_ur": "پیمانہ پورا بھرو اور سیدھے ترازو سے ٹھیک تولو، یہ انجام کے لحاظ سے بہتر ہے", "arabic": "وَ اَوْفُوا الْكَیْلَ اِذَا كِلْتُمْ وَ زِنُوْا بِالْقِسْطَاسِ الْمُسْتَقِیْمِؕ-ذٰلِكَ خَیْرٌ وَّ اَحْسَنُ تَاْوِیْلًا", "urdu_kanzul_iman": "اور ماپو تو پورا ماپو اور برابر ترازو سے تولویہ بہتر ہے اور اس کا انجام اچھا۔", "english": "And (when) you measure, measure fully, and weigh correctly with the scale; this is better, and its outcome is good.", "reference_badge": "[بَنِیْٓ اِسْرَآءِیْل (اَلْاَسْرَاء): 35]", "reference_code": "[Al Isra 17:35]"}, {"surah_id": 83, "ayah_num": 1, "surah_name_ar": "اَلْمُطَفِّفِيْن", "surah_name_roman": "Al Mutaffifin", "title_ur": "خرابی ہے ناپ تول میں ڈنڈی مارنے اور کمی کرنے والوں کے لیے", "arabic": "وَیْلٌ لِّلْمُطَفِّفِیْنَ", "urdu_kanzul_iman": "کم تولنے والوں  کی خرابی ہے", "english": "Destruction is for those who weigh short.", "reference_badge": "[اَلْمُطَفِّفِيْن: 1]", "reference_code": "[Al Mutaffifin 83:1]"}, {"surah_id": 2, "ayah_num": 188, "surah_name_ar": "اَلْبَقَرَة", "surah_name_roman": "Al Baqarah", "title_ur": "آپس میں ایک دوسرے کا مال باطل، رشوت اور ناجائز طریقوں سے مت کھاؤ", "arabic": "وَ لَا تَاْكُلُوْا اَمْوَالَكُمْ بَیْنَكُمْ بِالْبَاطِلِ وَ تُدْلُوْا بِهَا اِلَى الْحُكَّامِ لِتَاْكُلُوْا فَرِیْقًا مِّنْ اَمْوَالِ النَّاسِ بِالْاِثْمِ وَ اَنْتُمْ تَعْلَمُوْنَ", "urdu_kanzul_iman": "اور آپس میں ایک دوسرے کا مال ناحق نہ کھاؤ اور نہ حاکموں کے پاس ان کا مقدمہ اس لئے پہنچاؤ کہ لوگوں کا کچھ مال ناجائز طور پر کھالو جان بوجھ کر۔", "english": "And do not unfairly consume the wealth of each other, nor take their cases to rulers, in order that you may wrongfully consume a part of other people's wealth knowingly.", "reference_badge": "[اَلْبَقَرَة: 188]", "reference_code": "[Al Baqarah 2:188]"}, {"surah_id": 2, "ayah_num": 282, "surah_name_ar": "اَلْبَقَرَة", "surah_name_roman": "Al Baqarah", "title_ur": "قرض اور کاروباری لین دین کے معاملات کو تحریری دستاویز میں درج کر لیا کرو", "arabic": "یٰاَیُّهَا الَّذِیْنَ اٰمَنُوْا اِذَا تَدَایَنْتُمْ بِدَیْنٍ اِلٰى اَجَلٍ مُّسَمًّى فَاكْتُبُوْهُؕ-وَ لْیَكْتُبْ بَّیْنَكُمْ كَاتِبٌ بِالْعَدْلِ۪-وَ لَا یَاْبَ كَاتِبٌ اَنْ یَّكْتُبَ كَمَا عَلَّمَهُ اللّٰهُ فَلْیَكْتُبْ-وَ لْیُمْلِلِ الَّذِیْ عَلَیْهِ الْحَقُّ وَ لْیَتَّقِ اللّٰهَ رَبَّهٗ وَ لَا یَبْخَسْ مِنْهُ شَیْــٴًـاؕ-فَاِنْ كَانَ الَّذِیْ عَلَیْهِ الْحَقُّ سَفِیْهًا اَوْ ضَعِیْفًا اَوْ لَا یَسْتَطِیْعُ اَنْ یُّمِلَّ هُوَ فَلْیُمْلِلْ وَلِیُّهٗ بِالْعَدْلِؕ-وَ اسْتَشْهِدُوْا شَهِیْدَیْنِ مِنْ رِّجَالِكُمْ-فَاِنْ لَّمْ یَكُوْنَا رَجُلَیْنِ فَرَجُلٌ وَّ امْرَاَتٰنِ مِمَّنْ تَرْضَوْنَ مِنَ الشُّهَدَآءِ اَنْ تَضِلَّ اِحْدٰىهُمَا فَتُذَكِّرَ اِحْدٰىهُمَا الْاُخْرٰىؕ-وَ لَا یَاْبَ الشُّهَدَآءُ اِذَا مَا دُعُوْاؕ-وَ لَا تَسْــٴَـمُوْا اَنْ تَكْتُبُوْهُ صَغِیْرًا اَوْ كَبِیْرًا اِلٰى اَجَلِهٖؕ-ذٰلِكُمْ اَقْسَطُ عِنْدَ اللّٰهِ وَ اَقْوَمُ لِلشَّهَادَةِ وَ اَدْنٰى اَلَّا تَرْتَابُوْا اِلَّا اَنْ تَكُوْنَ تِجَارَةً حَاضِرَةً تُدِیْرُوْنَهَا بَیْنَكُمْ فَلَیْسَ عَلَیْكُمْ جُنَاحٌ اَلَّا تَكْتُبُوْهَاؕ-وَ اَشْهِدُوْا اِذَا تَبَایَعْتُمْ۪-وَ لَا یُضَآرَّ كَاتِبٌ وَّ لَا شَهِیْدٌ۬ؕ-وَ اِنْ تَفْعَلُوْا فَاِنَّهٗ فُسُوْقٌ بِكُمْؕ-وَ اتَّقُوا اللّٰهَؕ-وَ یُعَلِّمُكُمُ اللّٰهُؕ-وَ اللّٰهُ بِكُلِّ شَیْءٍ عَلِیْمٌ", "urdu_kanzul_iman": "اے ایمان والو جب تم ایک مقرر مدت تک کسی دین کا لین دین کرو تو اسے لکھ لو اور چاہئے کہ تمہارے درمیان کوئی لکھنے والا ٹھیک ٹھیک لکھے اور لکھنے والا لکھنے سے انکار نہ کرے جیسا کہ اسے  اللہ  نے سکھایا ہے تو اسے لکھ دینا چاہئے اور جس پر حق آتا ہے وہ لکھاتا جائے اور  اللہ  سے ڈرے جو اس کا رب ہے اور حق میں سے کچھ رکھ نہ چھوڑے پھر جس پر حق آتا ہے اگر بے عقل یا ناتواں ہو یا لکھا نہ سکے تو اس کا ولی انصاف سے لکھائے، اور دو گواہ کرلو اپنے مَردوں میں سے پھر اگر دو مرد نہ ہوں تو ایک مرد اور دو عورتیں ایسے گواہ جن کو پسند کروکہ کہیں ان میں ایک عورت بھولے تو اس ایک کو دوسری یاد دلاوے اور گواہ جب بلائے جائیں تو آنے سے انکار نہ کریں اور اسے بھاری نہ جانو کہ دَین چھوٹا ہو یا بڑا اس کی میعاد تک لکھت کرلو یہ  اللہ   کے نزدیک زیادہ انصاف کی بات ہے اوراس میں گواہی خوب ٹھیک رہے گی اور یہ اس سے قریب ہے کہ تمہیں شبہہ نہ پڑے مگر یہ کہ کوئی سردست کا سودا دست بَدست ہو تو اس کے نہ لکھنے کا تم پر گناہ نہیں اور جب خرید و فروخت کرو تو گواہ کرلو اور نہ کسی لکھنے والے کو ضَرر دیا جائے، نہ گواہ کو (یا، نہ لکھنے والا ضَرر دے نہ گواہ) اور جو ایسا کرو تو یہ تمہارا فسق ہوگا اور  اللہ  سے ڈرو اور  اللہ  تمہیں سکھاتا ہے، اور  اللہ  سب کچھ جانتا ہے۔", "english": "O believers! If you make an agreement of debt for a specified period, so write it down. And a scribe should accurately write (the agreement) between you accurately, and the scribe should not refuse to write in the manner that Allah has taught him, he should therefore write (it). And the liable person (i.e. the debtor) should dictate to him and should fear Allah Who is his Lord, and not omit anything concerning the rights (of those involved); if the debtor is then of low understanding, or incapable, or unable to dictate by himself, his guardian should therefore dictate with justice. And appoint two witnesses from amongst your men; then if two men are not available, so one man and two women; from such witnesses whom you like, so that if one of the women forgets, the other can therefore remind her. And the witnesses must therefore not refuse when called upon to testify. Do not feel it a burden (to write it), whether the debt is small or big; write it down along with its fixed period; this is closer to justice according to Allah, and will be of strong evidence and more likely to prevent doubts amongst yourselves except when it is an instant trade in which the exchange is immediate; so there is no sin upon you for not writing it down. And appoint witnesses when you therefore conclude a contract of buying and selling, and neither the scribe nor the witnesses be subjected to any harm (or the scribe and witness must not cause any harm to anyone else); and if you do so, this would henceforth be a sin on your part. And fear Allah, and Allah teaches you (His rules), and Allah knows everything.", "reference_badge": "[اَلْبَقَرَة: 282]", "reference_code": "[Al Baqarah 2:282]"}, {"surah_id": 25, "ayah_num": 67, "surah_name_ar": "اَلْفُرْقَان", "surah_name_roman": "Al Furqan", "title_ur": "خرچ میں نہ فضول خرچی کرو نہ کنجوسی، بلکہ اعتدال اور میانہ روی کا راستہ چنو", "arabic": "وَ الَّذِیْنَ اِذَا اَنْفَقُوْا لَمْ یُسْرِفُوْا وَ لَمْ یَقْتُرُوْا وَ كَانَ بَیْنَ ذٰلِكَ قَوَامًا", "urdu_kanzul_iman": "اور وہ کہ جب خرچ کرتے ہیں  نہ حد سے بڑھیں  اور نہ تنگی کریں  اور ان دونوں  کے بیچ اعتدال پر رہیں ۔", "english": "And those who, when they spend, neither exceed the limits nor act miserly, and stay in moderation between the two.", "reference_badge": "[اَلْفُرْقَان: 67]", "reference_code": "[Al Furqan 25:67]"}, {"surah_id": 17, "ayah_num": 29, "surah_name_ar": "بَنِیْٓ اِسْرَآءِیْل (اَلْاَسْرَاء)", "surah_name_roman": "Al Isra", "title_ur": "نہ اپنا ہاتھ گردن سے باندھ لو اور نہ بالکل ہی کھلا چھوڑ دو کہ ملامت زدہ ہو جاؤ", "arabic": "وَ لَا تَجْعَلْ یَدَكَ مَغْلُوْلَةً اِلٰى عُنُقِكَ وَ لَا تَبْسُطْهَا كُلَّ الْبَسْطِ فَتَقْعُدَ مَلُوْمًا مَّحْسُوْرًا", "urdu_kanzul_iman": "اور اپنا ہاتھ اپنی گردن سے بندھا ہوا نہ رکھ اور نہ پورا کھول دے کہ تو بیٹھ رہے ملامت کیا ہوا تھکا ہوا۔", "english": "And do not keep your hand tied to your neck (i.e. do not be miserly) nor open it completely (i.e. do not be wasteful), lest you sit down criticised, tired.", "reference_badge": "[بَنِیْٓ اِسْرَآءِیْل (اَلْاَسْرَاء): 29]", "reference_code": "[Al Isra 17:29]"}, {"surah_id": 5, "ayah_num": 1, "surah_name_ar": "اَلْمَـآئِدَة", "surah_name_roman": "Al Maidah", "title_ur": "اپنے معاہدات، قول و قرار اور کاروباری شرائط کو دیانت داری سے نبھاؤ", "arabic": "یٰاَیُّهَا الَّذِیْنَ اٰمَنُوْا اَوْفُوْا بِالْعُقُوْدِ۬ؕ-اُحِلَّتْ لَكُمْ بَهِیْمَةُ الْاَنْعَامِ اِلَّا مَا یُتْلٰى عَلَیْكُمْ غَیْرَ مُحِـلِّی الصَّیْدِ وَ اَنْتُمْ حُرُمٌؕ-اِنَّ اللّٰهَ یَحْكُمُ مَا یُرِیْدُ", "urdu_kanzul_iman": "اے ایمان والو اپنے قول پورے کرو تمہارے لئے حلال ہوئے بے زبان مویشی مگر وہ جو آگے سنایا جائے گا تم کو لیکن شکار حلال نہ سمجھو جب تم احرام میں ہو بیشک  اللہ  حکم فرماتا ہے جو چاہے۔", "english": "O believers! Fulfil your promises. Mute animals are made lawful for you (to eat) except that which will be stated to you further on, but do not regard hunting as lawful when you are in the state of Ihraam (the ritual attire for the performance of pilgrimage). Indeed, Allah commands as He wills.", "reference_badge": "[اَلْمَـآئِدَة: 1]", "reference_code": "[Al Maidah 5:1]"}]}, {"id": "vulnerable", "title_ur": "یتیموں، مسکینوں اور کمزوروں کے حقوق", "title_en": "Care for the Vulnerable & Orphans", "icon": "🤲", "description_ur": "یتیم کے مال کی حفاظت، مانگنے والے کو نہ جھڑکنا، احسان نہ جتانا اور ضرورت مندوں کی خبرگیری۔", "total_ayat": 7, "items": [{"surah_id": 93, "ayah_num": 9, "surah_name_ar": "اَلْضُّحٰی", "surah_name_roman": "Ad Duha", "title_ur": "یتیم پر سختی مت کرو اور مانگنے والے کو مت جھڑکو", "arabic": "فَاَمَّا الْیَتِیْمَ فَلَا تَقْهَرْ", "urdu_kanzul_iman": "تو یتیم پر دباؤ نہ ڈالو ۔", "english": "Therefore, do not put pressure on an orphan.", "reference_badge": "[اَلْضُّحٰی: 9]", "reference_code": "[Ad Duha 93:9]"}, {"surah_id": 17, "ayah_num": 34, "surah_name_ar": "بَنِیْٓ اِسْرَآءِیْل (اَلْاَسْرَاء)", "surah_name_roman": "Al Isra", "title_ur": "یتیم کے مال کے قریب نہ جاؤ مگر صرف اس کی بہتری کی نیت سے", "arabic": "وَ لَا تَقْرَبُوْا مَالَ الْیَتِیْمِ اِلَّا بِالَّتِیْ هِیَ اَحْسَنُ حَتّٰى یَبْلُغَ اَشُدَّه۪ٗ-وَ اَوْفُوْا بِالْعَهْدِ-اِنَّ الْعَهْدَ كَانَ مَسْـٴُـوْلًا", "urdu_kanzul_iman": "اور یتیم کے مال کے پاس نہ جاؤ مگر اس راہ سے جو سب سے بھلی ہے یہاں  تک کہ وہ اپنی جوانی کو پہنچے اور عہد پورا کرو بیشک عہد سے سوال ہونا ہے۔", "english": "And do not even approach the wealth of the orphan except in the best way, until he reaches the age of maturity. And fulfil (your) promise; indeed, (every) promise will be asked about (on the Day of Judgement).", "reference_badge": "[بَنِیْٓ اِسْرَآءِیْل (اَلْاَسْرَاء): 34]", "reference_code": "[Al Isra 17:34]"}, {"surah_id": 4, "ayah_num": 2, "surah_name_ar": "اَلنِّسَآء", "surah_name_roman": "An Nisa", "title_ur": "یتیموں کا مال پورا پورا ان کے حوالے کرو اور ان کا اچھا مال اپنے ردی مال سے نہ بدلو", "arabic": "وَ  اٰتُوا  الْیَتٰمٰى  اَمْوَالَهُمْ  وَ  لَا  تَتَبَدَّلُوا  الْخَبِیْثَ  بِالطَّیِّبِ   ۪-  وَ  لَا  تَاْكُلُوْا  اَمْوَالَهُمْ  اِلٰى  اَمْوَالِكُمْؕ-اِنَّهٗ  كَانَ  حُوْبًا  كَبِیْرًا", "urdu_kanzul_iman": "اور یتیموں کو ان کے مال دو اور ستھرے کے بدلے گندا نہ لو اور ان کے مال اپنے مالوں میں ملاکر نہ کھا جاؤ بیشک یہ بڑا گناہ ہے ۔", "english": "And give orphans their wealth, and do not exchange the pure for the impure, and do not consume their wealth by mixing your wealth with their wealth; this is indeed a big sin.", "reference_badge": "[اَلنِّسَآء: 2]", "reference_code": "[An Nisa 4:2]"}, {"surah_id": 2, "ayah_num": 263, "surah_name_ar": "اَلْبَقَرَة", "surah_name_roman": "Al Baqarah", "title_ur": "میٹھی بات کہہ دینا اور درگزر کرنا اس خیرات سے کہیں بہتر ہے جس کے بعد دل آزاری ہو", "arabic": "قَوْلٌ مَّعْرُوْفٌ وَّ مَغْفِرَةٌ خَیْرٌ مِّنْ صَدَقَةٍ یَّتْبَعُهَا اَذًىؕ-وَ اللّٰهُ غَنِیٌّ حَلِیْمٌ", "urdu_kanzul_iman": "اچھی بات کہنا اور درگزر کرنا اس خیرات سے بہتر ہے جس کے بعد ستانا ہو اور  اللہ  بے پرواہ حلم والا ہے۔", "english": "To speak kind words (to a beggar) and to forgive (his pestering) is better than that charity which is followed by causing anguish. And Allah is Independent, Most Forbearing.", "reference_badge": "[اَلْبَقَرَة: 263]", "reference_code": "[Al Baqarah 2:263]"}, {"surah_id": 2, "ayah_num": 264, "surah_name_ar": "اَلْبَقَرَة", "surah_name_roman": "Al Baqarah", "title_ur": "احسان جتا کر اور تکلیف پہنچا کر اپنی خیرات کو برباد مت کرو", "arabic": "یٰاَیُّهَا الَّذِیْنَ اٰمَنُوْا لَا تُبْطِلُوْا صَدَقٰتِكُمْ بِالْمَنِّ وَ الْاَذٰى-كَالَّذِیْ یُنْفِقُ مَالَهٗ رِئَآءَ النَّاسِ وَ لَا یُؤْمِنُ بِاللّٰهِ وَ الْیَوْمِ الْاٰخِرِؕ-فَمَثَلُهٗ كَمَثَلِ صَفْوَانٍ عَلَیْهِ تُرَابٌ فَاَصَابَهٗ وَابِلٌ فَتَرَكَهٗ صَلْدًاؕ-لَا یَقْدِرُوْنَ عَلٰى شَیْءٍ مِّمَّا كَسَبُوْاؕ-وَ اللّٰهُ لَا یَهْدِی الْقَوْمَ الْكٰفِرِیْنَ", "urdu_kanzul_iman": "اے ایمان والو اپنے صدقے باطل نہ کردو احسان رکھ کر اور ایذا دے کر اس کی طرح جو اپنا مال لوگوں کے دکھاوے کے لئے خرچ کرے اور  اللہ  اور قیامت پر ایمان نہ لائے، تو اس کی کہاوت ایسی ہے جیسے ایک چٹان کہ اس پر مٹی ہے اب اس پر زور کا پانی پڑا جس نے اسے نرا پتھر کر چھوڑا اپنی کمائی سے کسی چیز پر قابو نہ پائیں گے اور  اللہ  کافروں کو راہ نہیں دیتا۔", "english": "O believers! Do not invalidate your charity by boasting of favours and by causing anguish, like the one who spends his wealth to show off to people, and (he) believes not in Allah and the Last Day. His example is therefore similar to that of a (smooth) rock covered with dust and thereupon heavy rain fell on it, leaving it a bare rock. They will not have control over anything they have earned, and Allah does not guide the disbelievers (due to their stubbornness upon disbelief).", "reference_badge": "[اَلْبَقَرَة: 264]", "reference_code": "[Al Baqarah 2:264]"}, {"surah_id": 17, "ayah_num": 26, "surah_name_ar": "بَنِیْٓ اِسْرَآءِیْل (اَلْاَسْرَاء)", "surah_name_roman": "Al Isra", "title_ur": "رشتہ دار، مسکین اور مسافر کا حق ادا کرو اور فضول اڑانے سے بچو", "arabic": "وَ اٰتِ ذَا الْقُرْبٰى حَقَّهٗ وَ الْمِسْكِیْنَ وَ ابْنَ السَّبِیْلِ وَ لَا تُبَذِّرْ تَبْذِیْرًا", "urdu_kanzul_iman": "اور رشتہ داروں  کو ان کا حق دے اور مسکین اور مسافر کو اور فضول نہ اڑا۔", "english": "And give relatives their right, and (give) to the needy and to the traveller, and do not spend wastefully.", "reference_badge": "[بَنِیْٓ اِسْرَآءِیْل (اَلْاَسْرَاء): 26]", "reference_code": "[Al Isra 17:26]"}, {"surah_id": 107, "ayah_num": 1, "surah_name_ar": "اَلْمَاعُوْن", "surah_name_roman": "Al Maun", "title_ur": "دین کو جھٹلانے والا وہ ہے جو یتیم کو دھکے دیتا ہے اور مسکین کو کھانا نہیں کھلاتا", "arabic": "اَرَءَیْتَ الَّذِیْ یُكَذِّبُ بِالدِّیْنِ", "urdu_kanzul_iman": "بھلا دیکھو تو جو دین کو جھٹلاتا ہے ۔", "english": "Do you see the one who belies the religion?", "reference_badge": "[اَلْمَاعُوْن: 1]", "reference_code": "[Al Maun 107:1]"}]}, {"id": "dialogue", "title_ur": "اختلاف، بحث اور دعوت کے آداب", "title_en": "Dialogue, Debate & Admonition", "icon": "🤝", "description_ur": "حکمت اور موثر نصیحت سے سمجھانا، شائستہ ترین انداز میں گفتگو کرنا، اور باہمی صلح کروانا۔", "total_ayat": 6, "items": [{"surah_id": 16, "ayah_num": 125, "surah_name_ar": "اَلنَّحْل", "surah_name_roman": "An Nahl", "title_ur": "حکمت اور اچھی نصیحت کے ساتھ بلاؤ اور ان سے ایسے طریقے سے بحث کرو جو سب سے شائستہ ہو", "arabic": "اُدْعُ اِلٰى سَبِیْلِ رَبِّكَ بِالْحِكْمَةِ وَ الْمَوْعِظَةِ الْحَسَنَةِ وَ جَادِلْهُمْ بِالَّتِیْ هِیَ اَحْسَنُؕ-اِنَّ رَبَّكَ هُوَ اَعْلَمُ بِمَنْ ضَلَّ عَنْ سَبِیْلِهٖ وَ هُوَ اَعْلَمُ بِالْمُهْتَدِیْنَ", "urdu_kanzul_iman": "اپنے رب کی راہ کی طرف بلاؤ پکی تدبیر اور اچھی نصیحت سے اور ان سے اس طریقہ پر بحث کرو جو سب سے بہتر ہو بیشک تمہارا رب خوب جانتا ہے جو اس کی راہ سے بہکا اور وہ خوب جانتا ہے راہ والوں  کو۔", "english": "Call towards the path of your Lord with sound planning and good advice, and argue with them in that manner which is deemed the best. Indeed, your Lord knows well who has strayed from His path, and He knows well those who are guided.", "reference_badge": "[اَلنَّحْل: 125]", "reference_code": "[An Nahl 16:125]"}, {"surah_id": 29, "ayah_num": 46, "surah_name_ar": "اَلْعَنْـكَبُوْت", "surah_name_roman": "Al Ankabut", "title_ur": "اہلِ کتاب سے بھی گفتگو اور مکالمہ کرو تو انتہائی عمدہ اور شائستہ طریقے سے کرو", "arabic": "وَ لَا تُجَادِلُوْا اَهْلَ الْكِتٰبِ اِلَّا بِالَّتِیْ هِیَ اَحْسَنُ  اِلَّا الَّذِیْنَ ظَلَمُوْا مِنْهُمْ وَ قُوْلُوْا اٰمَنَّا بِالَّذِیْ اُنْزِلَ اِلَیْنَا وَ اُنْزِلَ اِلَیْكُمْ وَ اِلٰهُنَا وَ اِلٰهُكُمْ وَاحِدٌ وَّ نَحْنُ لَهٗ مُسْلِمُوْنَ", "urdu_kanzul_iman": "اور اے مسلمانو!کتابیوں  سے نہ جھگڑو مگر بہتر طریقہ پر مگر وہ جنہوں  نے اُن میں  سے ظلم کیا اور کہو ہم ایمان لائے اس پر جو ہماری طرف اُترا اور جو تمہاری طرف اُترا اور ہمارا تمہارا ایک معبود ہے اور ہم اس کے حضور گردن رکھے ہیں ۔", "english": "And O Muslims, do not dispute with the People of the Book but in the best manner, except (with) those amongst them who oppress. And say (to them), 'We believe in what has been sent down towards us and what has been sent towards you, and our and your God is One, and we have submitted ourselves to Him.'", "reference_badge": "[اَلْعَنْـكَبُوْت: 46]", "reference_code": "[Al Ankabut 29:46]"}, {"surah_id": 49, "ayah_num": 6, "surah_name_ar": "اَلْحُجُرٰت", "surah_name_roman": "Al Hujurat", "title_ur": "جب کوئی فاسق کوئی خبر لے کر آئے تو پہلے اچھی طرح تحقیق اور تصدیق کر لیا کرو", "arabic": "یٰاَیُّهَا الَّذِیْنَ اٰمَنُوْا اِنْ جَآءَكُمْ فَاسِقٌ بِنَبَاٍ فَتَبَیَّنُوْا اَنْ تُصِیْبُوْا قَوْمًا بِجَهَالَةٍ فَتُصْبِحُوْا عَلٰى مَا فَعَلْتُمْ نٰدِمِیْنَ", "urdu_kanzul_iman": "اے ایمان والو اگر کوئی فاسق تمہارے پاس کوئی خبر لائے تو تحقیق کرلو کہ کہیں  کسی قوم کو بے جانے ایذا نہ دے بیٹھو پھر اپنے کئے پر پچھتاتے رہ جاؤ۔", "english": "O believers! If any sinner brings you some news, so you must investigate (it) in case you unknowingly cause suffering to some people then (later on) remain regretful for what you have done.", "reference_badge": " َان", "surah_name_roman": "Al Imran", "title_ur": "لوگوں کے لیے نرم مزاج رہو، اگر سخت دل ہوتے تو لوگ تمہارے گرد سے چھٹ جاتے", "arabic": "فَبِمَا  رَحْمَةٍ  مِّنَ  اللّٰهِ  لِنْتَ  لَهُمْ-وَ  لَوْ  كُنْتَ  فَظًّا  غَلِیْظَ  الْقَلْبِ  لَا  نْفَضُّوْا  مِنْ  حَوْلِكَ۪-  فَاعْفُ  عَنْهُمْ  وَ  اسْتَغْفِرْ  لَهُمْ  وَ  شَاوِرْهُمْ  فِی  الْاَمْرِ-فَاِذَا  عَزَمْتَ  فَتَوَكَّلْ  عَلَى  اللّٰهِؕ-اِنَّ  اللّٰهَ  یُحِبُّ  الْمُتَوَكِّلِیْنَ", "urdu_kanzul_iman": "تو کیسی کچھ  اللہ  کی مہربانی ہے کہ اے محبوب تم ان کے لئے نرم دل ہوئے اور اگر تند مزاج سخت دل ہوتے تو وہ ضرور تمہارے گرد سے پریشان ہوجاتے تو تم انہیں معاف فرماؤ اور ان کی شفاعت کرو اور کاموں میں ان سے مشورہ لو اور جو کسی بات کا ارادہ پکا کرلو تو  اللہ  پر بھروسہ کرو بیشک توکل والے  اللہ  کو پیارے ہیں۔", "english": "So, what a great mercy it is from Allah that, O Beloved, you became soft-hearted towards them. And if you had been harsh and hard-hearted, they would have therefore certainly been anxious in your surrounding; so forgive them, and intercede for them and consult with them in matters. And when you come to a firm decision regarding any matter, so have trust in Allah; indeed, Allah loves those who have trust (in Him).", "reference_badge": "[اٰلِ عِمْرَان: 159]", "reference_code": "[Al Imran 3:159]"}]}]};
  </script>

  <!-- Interactive Logic -->
  <script>
    (function() {
      const data = window.QURAN_MANNERS_DATA;
      if (!data) return;

      let activeModuleId = "all";
      let searchQuery = "";
      const scales = [0.85, 1.0, 1.15, 1.3, 1.5];
      let currentScaleIdx = 1;

      // Font Scaler
      const decBtn = document.getElementById("btn-font-dec");
      const incBtn = document.getElementById("btn-font-inc");
      const resetBtn = document.getElementById("btn-font-reset");

      function applyScale() {
        const scale = scales[currentScaleIdx];
        document.documentElement.style.setProperty('--ayah-font-scale', scale);
        if (resetBtn) resetBtn.textContent = `${Math.round(scale * 100)}%`;
        localStorage.setItem("manners_font_scale", scale);
      }

      const savedScale = localStorage.getItem("manners_font_scale");
      if (savedScale) {
        const idx = scales.indexOf(parseFloat(savedScale));
        if (idx !== -1) currentScaleIdx = idx;
        applyScale();
      }

      if (decBtn) decBtn.addEventListener("click", () => {
        if (currentScaleIdx > 0) {
          if (window.AudioSFX) window.AudioSFX.playClick();
          currentScaleIdx--;
          applyScale();
        }
      });

      if (incBtn) incBtn.addEventListener("click", () => {
        if (currentScaleIdx < scales.length - 1) {
          if (window.AudioSFX) window.AudioSFX.playClick();
          currentScaleIdx++;
          applyScale();
        }
      });

      if (resetBtn) resetBtn.addEventListener("click", () => {
        if (window.AudioSFX) window.AudioSFX.playClick();
        currentScaleIdx = 1;
        applyScale();
      });

      // Render Modules Nav
      const navContainer = document.getElementById("modules-nav");
      let navHtml = `<button class="module-tab-btn active" data-mod="all">✨ تمام آداب <span class="module-tab-badge">${data.metadata.total_injunctions}</span></button>`;
      data.modules.forEach(m => {
        navHtml += `<button class="module-tab-btn" data-mod="${m.id}">${m.icon} ${m.title_ur} <span class="module-tab-badge">${m.total_ayat}</span></button>`;
      });
      navContainer.innerHTML = navHtml;

      navContainer.querySelectorAll(".module-tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          if (window.AudioSFX) window.AudioSFX.playClick();
          navContainer.querySelectorAll(".module-tab-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          activeModuleId = btn.dataset.mod;
          renderList();
        });
      });

      // Search Listener
      const searchInput = document.getElementById("manners-search");
      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          searchQuery = e.target.value.trim().toLowerCase();
          renderList();
        });
      }

      // Toast Notification
      function showToast(msg) {
        const toast = document.getElementById("copy-toast");
        if (!toast) return;
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2200);
      }

      // Render Cards List
      const listContainer = document.getElementById("manners-list");
      const countBadge = document.getElementById("manners-count-badge");

      function renderList() {
        let allItems = [];
        data.modules.forEach(m => {
          if (activeModuleId === "all" || activeModuleId === m.id) {
            m.items.forEach(it => {
              allItems.push({ ...it, module_title: m.title_ur, module_icon: m.icon });
            });
          }
        });

        if (searchQuery) {
          allItems = allItems.filter(it => {
            return it.title_ur.toLowerCase().includes(searchQuery) ||
                   it.urdu_kanzul_iman.includes(searchQuery) ||
                   it.arabic.includes(searchQuery) ||
                   it.reference_badge.includes(searchQuery) ||
                   (it.english && it.english.toLowerCase().includes(searchQuery));
          });
        }

        if (countBadge) {
          countBadge.textContent = `نمایاں ہدایات: ${allItems.length}`;
        }

        if (allItems.length === 0) {
          listContainer.innerHTML = `
            <div style="text-align: center; padding: 60px 20px; color: var(--text-dim); background: var(--bg-card-glass); border-radius: var(--radius-lg);">
              <div style="font-size: 2.5rem; margin-bottom: 10px;">🔍</div>
              <div style="font-size: 1.15rem; font-weight: 700; color: #fbbf24;">کوئی آیت اس تلاش پر نہیں ملی</div>
              <p style="margin-top: 6px; font-size: 0.9rem;">براہ کرم کوئی دوسرا لفظ یا باب منتخب کریں۔</p>
            </div>
          `;
          return;
        }

        let html = "";
        allItems.forEach((it, idx) => {
          html += `
            <article class="manner-card" id="manner-item-${idx}">
              <div class="manner-card-header">
                <div class="manner-headline">
                  <span>${it.module_icon || '🌿'}</span>
                  <span>${it.title_ur}</span>
                </div>
                <div class="manner-ref-badge">${it.reference_badge}</div>
              </div>

              <div class="manner-arabic-text">﴿${it.arabic}﴾</div>

              <div class="manner-urdu-box">
                <div class="manner-urdu-kanzuliman">${it.urdu_kanzul_iman}</div>
              </div>

              <div class="manner-card-footer">
                ${it.english ? `<div class="manner-en-translation">${it.english}</div>` : '<div></div>'}
                <button class="copy-manner-btn" data-text="﴿${it.arabic}﴾&#10;&#10;ترجمہ کنز الایمان:&#10;${it.urdu_kanzul_iman}&#10;&#10;${it.reference_badge}">
                  <span>📋 کاپی کریں</span>
                </button>
              </div>
            </article>
          `;
        });

        listContainer.innerHTML = html;

        // Copy button listeners
        listContainer.querySelectorAll(".copy-manner-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            if (window.AudioSFX) window.AudioSFX.playClick();
            const textToCopy = btn.dataset.text;
            navigator.clipboard.writeText(textToCopy).then(() => {
              showToast("✓ ترجمہ کنز الایمان مع حوالہ کاپی ہو گیا!");
            }).catch(() => {
              const tempInput = document.createElement("textarea");
              tempInput.value = textToCopy;
              document.body.appendChild(tempInput);
              tempInput.select();
              document.execCommand("copy");
              document.body.removeChild(tempInput);
              showToast("✓ ترجمہ کنز الایمان مع حوالہ کاپی ہو گیا!");
            });
          });
        });
      }

      renderList();
    })();
  </script>
